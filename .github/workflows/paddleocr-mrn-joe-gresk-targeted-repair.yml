name: PaddleOCR Joe Gresk Targeted Layout Repair

on:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-mrn-joe-gresk-targeted-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: paddleocr-joe-gresk-targeted-layout-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - issue: '1971-09-02'
            pages: '["007.jpg"]'
          - issue: '1971-09-19'
            pages: '["002.jpg"]'
          - issue: '1971-10-10'
            pages: '["023.jpg"]'
          - issue: '1971-11-11'
            pages: '["006.jpg"]'
          - issue: '1971-12-09'
            pages: '["002.jpg"]'

    steps:
      - name: Check out newspaper OCR runner
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR target page with line geometry
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          NEWSPAPER_PUBLICATION: midwest-racing-news
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGES_JSON: ${{ matrix.pages }}
          MRN_COLUMN_COUNT: '5'
          MRN_OUTPUT_ROOT: audit/paddleocr-joe-gresk-targeted/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Repair layout metadata in Supabase
        shell: bash
        env:
          ISSUE: ${{ matrix.issue }}
          OUTPUT_ROOT: audit/paddleocr-joe-gresk-targeted/${{ matrix.issue }}
        run: |
          set -euo pipefail
          oidc="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$oidc"

          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUTPUT_ROOT'])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          out=Path('/tmp/layout-repairs')
          out.mkdir(parents=True,exist_ok=True)
          pages=summary.get('pages') or []
          if not pages:
              raise SystemExit('summary.json contains no pages')
          for i,meta in enumerate(pages):
              page=str(meta.get('page') or '')
              lines=((meta.get('line_layout') or {}).get('lines') or [])
              if not page or not lines:
                  raise SystemExit(f'Missing page or line geometry for {page!r}')
              payload={
                  'publication':'midwest-racing-news',
                  'year':1971,
                  'issue':os.environ['ISSUE'],
                  'page':page,
                  'meta':meta,
                  'summary':summary,
              }
              (out/f'{i:03d}.json').write_text(json.dumps(payload,separators=(',',':')),encoding='utf-8')
              print(page, len(lines), 'layout lines')
          PY

          count=0
          for payload_file in /tmp/layout-repairs/*.json; do
            page_name="$(jq -r '.page' "$payload_file")"
            echo "Repairing ${ISSUE} ${page_name}"
            http_code="$(curl -sS -o /tmp/layout-response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${oidc}" \
              -H 'Content-Type: application/json' \
              --data-binary @"$payload_file" \
              'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-layout-repair')"
            cat /tmp/layout-response.json
            echo
            test "$http_code" -ge 200 -a "$http_code" -lt 300
            jq -e '.ok == true and (.layout_lines // 0) > 0' /tmp/layout-response.json >/dev/null
            count=$((count + 1))
          done
          echo "Successfully repaired ${count} target page(s)"
