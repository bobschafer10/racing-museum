name: Temporary Wayback Cedar Lake Audit

on:
  push:
    paths:
      - '.github/workflows/wayback-cedarlake-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch known Cedar Lake standings captures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/wayback-cedarlake
          python - <<'PY'
          import json, time, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          OUT = Path('audit/wayback-cedarlake')
          TARGET = 'http://www.racingonline.com:80/cedarlake/stand.html'
          CAPTURES = [
              '19980120035710',
              '19980527004908',
              '19980704213229',
              '19990210053204',
              '20000709094809',
              '20001011010811',
              '20010115043400',
          ]
          UA='UMARM historical standings recovery/1.0'

          class Extractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_title=False; self.title=[]; self.in_cell=False; self.cell=[]
                  self.row=None; self.current_table=None; self.tables=[]; self.text=[]
              def handle_starttag(self, tag, attrs):
                  t=tag.lower()
                  if t=='title': self.in_title=True
                  elif t=='table': self.current_table=[]
                  elif t=='tr': self.row=[]
                  elif t in ('td','th'): self.in_cell=True; self.cell=[]
              def handle_endtag(self, tag):
                  t=tag.lower()
                  if t=='title': self.in_title=False
                  elif t in ('td','th') and self.in_cell:
                      v=' '.join(''.join(self.cell).split())
                      if self.row is not None: self.row.append(v)
                      self.in_cell=False; self.cell=[]
                  elif t=='tr' and self.row is not None:
                      if self.current_table is not None and any(self.row): self.current_table.append(self.row)
                      self.row=None
                  elif t=='table' and self.current_table is not None:
                      if self.current_table: self.tables.append(self.current_table)
                      self.current_table=None
              def handle_data(self,data):
                  if self.in_title: self.title.append(data)
                  if self.in_cell: self.cell.append(data)
                  s=' '.join(data.split())
                  if s: self.text.append(s)

          def get(url, attempts=5):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA})
                      with urllib.request.urlopen(req,timeout=90) as r:
                          return r.status,r.geturl(),r.read()
                  except Exception as e:
                      last=repr(e); print('ERROR',i+1,url,last); time.sleep(2*(i+1))
              raise RuntimeError(last)

          recovered=[]
          for ts in CAPTURES:
              urls=[
                  f'https://web.archive.org/web/{ts}id_/{TARGET}',
                  f'https://web.archive.org/web/{ts}/{TARGET}',
              ]
              item={'timestamp':ts,'attempted':urls}
              for url in urls:
                  try:
                      status,final_url,body=get(url)
                      html=body.decode('latin-1','replace')
                      p=Extractor(); p.feed(html)
                      item.update({'status':status,'resolved':final_url,'bytes':len(body),'title':' '.join(''.join(p.title).split()),'tables':p.tables,'body_text':' '.join(p.text)})
                      (OUT/f'{ts}.html').write_bytes(body)
                      print('CAPTURE',ts,status,len(body),item['title'],'tables',len(p.tables))
                      break
                  except Exception as e:
                      item.setdefault('errors',[]).append(repr(e))
              recovered.append(item)
          (OUT/'captures.json').write_text(json.dumps(recovered,indent=2,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Upload Cedar Lake recovery
        uses: actions/upload-artifact@v4
        with:
          name: wayback-cedarlake-captures
          path: audit/wayback-cedarlake
          if-no-files-found: error
          retention-days: 1
