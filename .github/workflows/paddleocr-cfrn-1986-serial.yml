name: Serial CFRN 1986 OCR rescue

on:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-cfrn-1986-serial.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          counts={
            '1986-04-23':16,'1986-06-04':24,'1986-06-25':24,'1986-07-02':24,
            '1986-07-09':24,'1986-07-16':20,'1986-07-23':20,'1986-08-06':20,
            '1986-08-13':20,'1986-08-20':26,'1986-08-27':24,'1986-09-03':24,
            '1986-09-10':16,'1986-09-17':16,'1986-09-24':16,'1986-10-01':12,'1986-10-22':12,
          }
          matrix={'include':[{'issue':k,'page_count':v} for k,v in counts.items()]}
          with open(sys.argv[1],'a',encoding='utf-8') as f:
              f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
          PY

  rescue:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ISSUE: ${{ matrix.issue }}
      PAGE_COUNT: ${{ matrix.page_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
      - name: Ensure Tesseract
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
          tesseract --version | head -1
      - name: Extract encoded rescue runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/paddleocr-cfrn-1986-rescue.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          rest=src[start:]
          end=rest.index("\n          PY\n")
          code=textwrap.dedent(rest[:end])
          Path('/tmp/cfrn1986-rescue.py').write_text(code,encoding='utf-8')
          print('extracted',len(code),'bytes')
          PY
      - name: Rescue OCR ${{ matrix.issue }} with serialized DB writes
        shell: bash
        run: python /tmp/cfrn1986-rescue.py
