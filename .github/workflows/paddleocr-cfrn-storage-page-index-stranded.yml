name: Index stranded CFRN stored OCR safely

on:
  push:
    paths:
      - '.github/workflows/paddleocr-cfrn-storage-page-index-stranded.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  index:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [1992, 1995]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Validate and index stored OCR pages for ${{ matrix.year }}
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.request, urllib.error

          PROJECT = 'szvkleurojiwqkkztxtr'
          PUBLICATION = 'checkered-flag-racing-news'
          STORAGE = f'https://{PROJECT}.supabase.co/storage/v1/object/public/media/newspapers/{PUBLICATION}'
          IMPORT = f'https://{PROJECT}.supabase.co/functions/v1/newspaper-ocr-import'
          YEAR = int(os.environ['YEAR'])
          OIDC_URL = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          OIDC_REQUEST_TOKEN = os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          # Later CFRN preparation files preserve one issue-level OCR file with
          # exact triple-newline page separators. Keep writes small and resumable.
          PAGE_BATCH = 2
          PAUSE_SECONDS = 0.50

          all_issues = {
            '1992-01-08':16,'1992-02-05':20,'1992-03-18':16,'1992-04-08':36,'1992-04-15':16,
            '1992-04-22':20,'1992-04-29':24,'1992-05-06':28,'1992-06-17':36,'1992-07-01':40,
            '1992-07-15':28,'1992-08-19':36,'1992-08-26':36,'1992-09-09':32,'1992-09-30':20,
            '1992-10-07':20,'1992-12-09':19,
            '1995-04-05':24,'1995-04-26':24,'1995-05-10':28,'1995-05-17':24,'1995-05-31':28,
            '1995-06-07':32,'1995-06-14':28,'1995-06-21':36,'1995-06-28':36,'1995-07-05':40,
            '1995-07-12':36,'1995-07-26':36,'1995-08-02':36,'1995-08-09':36,'1995-08-23':40,
            '1995-08-30':36,'1995-09-06':36,'1995-09-13':32,'1995-09-27':20,'1995-10-18':24,
          }
          issues = [(issue, count) for issue, count in all_issues.items() if issue.startswith(f'{YEAR}-')]
          if not issues:
              raise RuntimeError(f'No configured issues for {YEAR}')

          def open_with_retry(req, timeout, attempts=5):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      return urllib.request.urlopen(req, timeout=timeout)
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode('utf-8','replace')
                      last = RuntimeError(f'HTTP {e.code}: {detail}')
                      if e.code < 500 and e.code not in (408,409,429):
                          raise last
                  except (urllib.error.URLError, TimeoutError) as e:
                      last = e
                  if attempt < attempts:
                      time.sleep(min(attempt * 4, 20))
              raise RuntimeError(f'failed after retries: {last}')

          def fetch_ocr(issue):
              req = urllib.request.Request(
                  f'{STORAGE}/{issue}/ocr.txt',
                  headers={'User-Agent':'UMARM CFRN stranded OCR indexer/1.0'},
              )
              with open_with_retry(req, 60, 5) as r:
                  return r.read().decode('utf-8','replace')

          def split_pages(text, expected, issue):
              normalized = text.replace('\r\n','\n').replace('\r','\n').strip()
              # 1992/1995 preparation files use exactly three newlines between
              # scans; double newlines occur inside a page and must be retained.
              chunks = [chunk.strip() for chunk in re.split(r'(?<!\n)\n{3}(?!\n)', normalized) if chunk.strip()]
              if len(chunks) != expected:
                  raise RuntimeError(f'{issue}: expected {expected} page OCR sections, found {len(chunks)}')
              if any(len(chunk) < 20 for chunk in chunks):
                  raise RuntimeError(f'{issue}: suspiciously short OCR page section detected')
              return chunks

          # Validate the entire year before the first write so a malformed issue
          # cannot leave a partially published year.
          prepared = []
          total_chars = 0
          for issue, count in issues:
              chunks = split_pages(fetch_ocr(issue), count, issue)
              chars = sum(len(c) for c in chunks)
              total_chars += chars
              prepared.append((issue, count, chunks))
              print(f'VALIDATED {issue}: {count} scans / {len(chunks)} OCR page sections / {chars} chars', flush=True)
          print(f'YEAR VALIDATED {YEAR}: {len(prepared)} issues / {sum(x[1] for x in prepared)} pages', flush=True)

          def fresh_oidc_token():
              separator = '&' if '?' in OIDC_URL else '?'
              url = f'{OIDC_URL}{separator}audience=umarm-newspaper-ocr-import'
              req = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'bearer {OIDC_REQUEST_TOKEN}',
                      'User-Agent':'UMARM CFRN stranded OCR indexer/1.0',
                  },
              )
              with open_with_retry(req, 30, 5) as r:
                  token = json.loads(r.read().decode()).get('value')
              if not token:
                  raise RuntimeError('GitHub OIDC token response did not contain value')
              return token

          def import_batch(issue, pages):
              payload = {
                  'publication': PUBLICATION,
                  'year': YEAR,
                  'issue': issue,
                  'summary': {
                      'engine': 'Stored OCR text import',
                      'recognition_model': 'prepared CFRN OCR triple-newline page sections',
                  },
                  'pages': pages,
                  'candidates': [],
              }
              data = json.dumps(payload, separators=(',',':')).encode()
              last = None
              for attempt in range(1, 8):
                  token = fresh_oidc_token()
                  req = urllib.request.Request(
                      IMPORT,
                      data=data,
                      method='POST',
                      headers={
                          'Authorization': f'Bearer {token}',
                          'Content-Type': 'application/json',
                          'User-Agent':'UMARM CFRN stranded OCR indexer/1.0',
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=180) as r:
                          response = json.loads(r.read().decode())
                      if response.get('ok') and int(response.get('updated', 0)) == len(pages):
                          return response
                      last = RuntimeError(f'importer verification failed: {response}')
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode('utf-8','replace')
                      last = RuntimeError(f'HTTP {e.code}: {detail}')
                      if e.code < 500 and e.code not in (408,409,429):
                          raise last
                  except (urllib.error.URLError, TimeoutError) as e:
                      last = e
                  if attempt < 7:
                      delay = min(attempt * 5, 30)
                      print(f'{issue} batch retry {attempt}/7 after {last}; sleeping {delay}s', flush=True)
                      time.sleep(delay)
              raise RuntimeError(f'{issue} batch failed after fresh-token retries: {last}')

          total_pages = 0
          for issue, count, chunks in prepared:
              indexed_this_issue = 0
              for start in range(0, count, PAGE_BATCH):
                  stop = min(start + PAGE_BATCH, count)
                  pages = [
                      {
                          'page': f'{n:03d}.jpg',
                          'text': chunks[n-1],
                          'meta': {
                              'source': 'stored-ocr.txt',
                              'import_mode': 'triple-newline-page-sections',
                              'scan_position': n,
                              'line_layout': {'lines': []},
                          },
                      }
                      for n in range(start + 1, stop + 1)
                  ]
                  try:
                      response = import_batch(issue, pages)
                  except Exception:
                      # If a two-page write ever stresses production, fall back
                      # to the same proven one-page path used for the 1980s/1999.
                      if len(pages) == 1:
                          raise
                      print(f'FALLBACK {issue} scans {start+1:03d}-{stop:03d} to single-page writes', flush=True)
                      for page in pages:
                          import_batch(issue, [page])
                      response = {'skipped_page_write': False}
                  indexed_this_issue += len(pages)
                  print(
                      f'INDEXED {issue} scans {start+1:03d}-{stop:03d}: '
                      f'{len(pages)} rows (skipped_existing={response.get("skipped_page_write")})',
                      flush=True,
                  )
                  time.sleep(PAUSE_SECONDS)

              if indexed_this_issue != count:
                  raise RuntimeError(f'{issue}: indexed {indexed_this_issue}, expected {count}')
              total_pages += count
              print(f'ISSUE COMPLETE {issue}: {indexed_this_issue} searchable page rows', flush=True)

          print(json.dumps({
              'ok': True,
              'year': YEAR,
              'issues': len(prepared),
              'pages': total_pages,
              'characters': total_chars,
          }, indent=2), flush=True)
          PY
