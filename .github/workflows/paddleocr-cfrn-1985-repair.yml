name: Repair CFRN 1985 OCR issues

on:
  push:
    branches: [paddleocr-mrn-pilot]
    paths: ['.github/workflows/paddleocr-cfrn-1985-repair.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {issue: '1985-09-04', page_count: 20}
          - {issue: '1985-09-11', page_count: 20}
          - {issue: '1985-09-18', page_count: 20}
          - {issue: '1985-09-25', page_count: 16}
          - {issue: '1985-10-02', page_count: 16}
          - {issue: '1985-10-09', page_count: 12}
          - {issue: '1985-11-06', page_count: 1}
    env:
      ISSUE: ${{ matrix.issue }}
      PAGE_COUNT: ${{ matrix.page_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          sparse-checkout: museum-newspaper-manager/cfrn-1985-robust-ocr.py
          sparse-checkout-cone-mode: false
      - name: Ensure Tesseract
        shell: bash
        run: |
          set -euo pipefail
          command -v tesseract >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq tesseract-ocr; }
          tesseract --version | head -1
      - name: OCR and upload pages safely
        shell: bash
        run: python museum-newspaper-manager/cfrn-1985-robust-ocr.py
