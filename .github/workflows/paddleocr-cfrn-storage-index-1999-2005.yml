name: Index stored CFRN 1999-2005 OCR

on:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-cfrn-storage-index-1999-2005.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cfrn-stored-ocr-1999-2005
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [1999, 2000, 2001, 2003, 2004, 2005]
    steps:
      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-stored-issue-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Index CFRN ${{ matrix.year }} stored OCR
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          case "$YEAR" in
            1999) ISSUES="1999-01-20 1999-03-03 1999-03-17 1999-04-07 1999-04-21 1999-05-19 1999-05-26 1999-06-02 1999-07-28 1999-09-22 1999-09-29 1999-10-20" ;;
            2000) ISSUES="2000-01-19 2000-02-09 2000-03-01 2000-03-15 2000-04-05 2000-04-12 2000-04-19 2000-04-26 2000-09-27 2000-10-04 2000-12-06" ;;
            2001) ISSUES="2001-01-17 2001-02-07 2001-02-28 2001-03-14 2001-04-04 2001-04-11 2001-04-18 2001-04-25 2001-05-02 2001-05-09 2001-05-16 2001-06-06 2001-07-25 2001-08-15" ;;
            2003) ISSUES="2003-08-20 2003-09-03" ;;
            2004) ISSUES="2004-05-05 2004-07-21" ;;
            2005) ISSUES="2005-01-19 2005-02-09 2005-06-15 2005-06-22 2005-06-29 2005-07-06 2005-07-13" ;;
            *) echo "Unexpected year $YEAR" >&2; exit 1 ;;
          esac

          ENDPOINT="https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-stored-issue-import"
          for ISSUE in $ISSUES; do
            ok=0
            for attempt in 1 2 3; do
              code="$(curl -sS -o response.json -w '%{http_code}' \
                --max-time 125 \
                -X POST "$ENDPOINT" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H 'Content-Type: application/json' \
                --data "{\"issue\":\"$ISSUE\"}" || true)"
              if [ "$code" = "200" ] && jq -e '.ok == true' response.json >/dev/null 2>&1; then
                echo "$ISSUE: $(cat response.json)"
                ok=1
                break
              fi
              echo "$ISSUE attempt $attempt failed HTTP $code: $(cat response.json 2>/dev/null || true)" >&2
              sleep $((attempt * 3))
            done
            if [ "$ok" -ne 1 ]; then
              echo "$ISSUE failed after retries" >&2
              exit 1
            fi
          done
