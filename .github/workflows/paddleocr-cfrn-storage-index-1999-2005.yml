name: Index stored CFRN 1999-2005 OCR

on:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-cfrn-storage-index-1999-2005.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cfrn-stored-ocr-1999-2005
  cancel-in-progress: true

jobs:
  paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Bulk issue-level CFRN indexing is paused; use page-level OCR/layout import."
