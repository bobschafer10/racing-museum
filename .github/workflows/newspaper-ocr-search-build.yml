      - 'app/api/newspaper-search/**'
      - 'app/media/newspapers/**'
      - '.github/workflows/newspaper-ocr-search-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
