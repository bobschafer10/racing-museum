      NEXT_PUBLIC_SUPABASE_URL: https://szvkleurojiwqkkztxtr.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_9kqDFGpAX1iNTKhdoPJaSA_s8wcPLFP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
