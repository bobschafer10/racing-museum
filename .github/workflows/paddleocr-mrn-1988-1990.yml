name: PaddleOCR MRN 1988-1990

on:
  workflow_dispatch:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-mrn-1988-1990.yml'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      issue_count: ${{ steps.matrix.outputs.issue_count }}
      page_count: ${{ steps.matrix.outputs.page_count }}
    steps:
      - name: Build verified 1988-1990 issue matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          raw = '''
          1988-01-14,12
          1988-02-04,16
          1988-03-10,20
          1988-04-21,20
          1988-04-28,16
          1988-05-05,20
          1988-05-12,16
          1988-05-19,16
          1988-05-26,24
          1988-06-02,20
          1988-06-09,20
          1988-06-16,20
          1988-06-23,20
          1988-06-30,20
          1988-07-07,24
          1988-07-14,20
          1988-07-21,20
          1988-07-28,20
          1988-08-04,20
          1988-08-11,20
          1988-08-18,20
          1988-08-25,20
          1988-09-01,20
          1988-09-08,20
          1988-09-15,20
          1988-09-22,16
          1988-09-29,12
          1988-10-13,12
          1988-11-10,24
          1988-12-08,40
          1989-01-12,12
          1989-02-09,16
          1989-03-09,20
          1989-04-20,20
          1989-04-27,20
          1989-05-04,16
          1989-05-11,16
          1989-05-18,20
          1989-05-25,20
          1989-06-01,20
          1989-06-08,20
          1989-06-15,20
          1989-06-22,20
          1989-06-29,20
          1989-07-06,24
          1989-07-13,20
          1989-07-20,24
          1989-07-27,24
          1989-08-03,20
          1989-08-10,20
          1989-08-17,20
          1989-08-24,28
          1989-08-31,24
          1989-09-07,24
          1989-09-14,20
          1989-09-21,16
          1989-09-28,16
          1989-10-12,16
          1989-11-09,24
          1989-12-07,40
          1990-01-11,12
          1990-02-08,16
          1990-03-08,24
          1990-04-19,20
          1990-04-26,16
          1990-05-03,16
          1990-05-10,20
          1990-05-17,16
          1990-05-24,20
          1990-05-31,16
          1990-06-07,20
          1990-06-14,20
          1990-06-21,24
          1990-06-28,24
          1990-07-05,24
          1990-07-12,20
          1990-07-19,24
          1990-07-26,20
          1990-08-02,20
          1990-08-09,20
          1990-08-16,20
          1990-08-23,20
          1990-08-30,20
          1990-09-06,24
          1990-09-13,20
          1990-09-20,16
          1990-09-27,16
          1990-10-11,16
          1990-11-08,28
          1990-12-13,40
          '''

          rows=[]
          total_pages=0
          for line in raw.splitlines():
              line=line.strip()
              if not line:
                  continue
              issue, count_s = line.split(',')
              count=int(count_s)
              year=int(issue[:4])
              pages=[f'{n:03d}.jpg' for n in range(1, count + 1)]
              rows.append({
                  'year': year,
                  'issue': issue,
                  'pages_json': json.dumps(pages, separators=(',', ':')),
                  'page_count': count,
              })
              total_pages += count

          if len(rows) != 90 or total_pages != 1820:
              raise SystemExit(f'Control matrix mismatch: {len(rows)} issues / {total_pages} pages')
          controls={1988:588,1989:620,1990:612}
          for year, expected in controls.items():
              actual=sum(r['page_count'] for r in rows if r['year']==year)
              if actual != expected:
                  raise SystemExit(f'{year} control total mismatch: {actual} != {expected}')

          matrix=json.dumps({'include':rows}, separators=(',', ':'))
          print(f'MRN 1988-1990: {len(rows)} issues / {total_pages} verified numbered pages')
          out=Path(sys.argv[1])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'issue_count={len(rows)}\n')
              f.write(f'page_count={total_pages}\n')
              f.write(f'matrix={matrix}\n')
          PY

  ocr_and_ingest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out OCR runner only
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR ${{ matrix.issue }}
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          NEWSPAPER_PUBLICATION: midwest-racing-news
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGES_JSON: ${{ matrix.pages_json }}
          MRN_OUTPUT_ROOT: audit/paddleocr-mrn-1988-1990/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ingest searchable OCR and standings candidates
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          ISSUE: ${{ matrix.issue }}
          EXPECTED_PAGES: ${{ matrix.page_count }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ISSUE_DIR: audit/paddleocr-mrn-1988-1990/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python - "$ISSUE_DIR" "$YEAR" > /tmp/ocr-payload.json <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          year=int(sys.argv[2])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')) if (root/'candidates.json').exists() else []
          pages=[]
          for meta in summary.get('pages',[]):
              page=str(meta['page'])
              stem=Path(page).stem
              text=(root/'text'/f'{stem}-columns.txt').read_text(encoding='utf-8')
              pages.append({'page':page,'text':text,'meta':meta})
          print(json.dumps({
              'publication':'midwest-racing-news',
              'year':year,
              'issue':summary['issue_date'],
              'summary':summary,
              'pages':pages,
              'candidates':candidates,
          }, separators=(',',':')))
          PY
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ocr-payload.json \
            'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-import')"
          echo "$ISSUE: $response"
          updated="$(echo "$response" | jq -r '.updated // 0')"
          test "$updated" -eq "$EXPECTED_PAGES"

      - name: Upload OCR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-${{ matrix.issue }}
          path: audit/paddleocr-mrn-1988-1990/${{ matrix.issue }}
          if-no-files-found: warn
          retention-days: 14
