name: Collect EWSCA OCR and Prepare Museum Import

on:
  push:
    paths:
      - '.github/workflows/collect-ewsca-ocr.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 41563019962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ewsca-ocr-*
          path: audit-ocr
          merge-multiple: true
      - name: Validate and export per-year master records and five-page import chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          counts={1990:45,1991:40,1993:40,1994:43,1995:41,1996:40,1997:37}
          output=Path('audit/yearbook-ocr')
          output.mkdir(parents=True,exist_ok=True)
          for year,n in counts.items():
              slug=f'{year}-eastern-wisconsin-stock-car-association-yearbook'
              source=Path('audit-ocr')/slug/'part-001.json'
              assert source.is_file(),f'Missing source {source}'
              rows=json.loads(source.read_text(encoding='utf8'))
              assert len(rows)==n
              assert [x['page_number'] for x in rows]==list(range(1,n+1))
              assert all(x['status']=='complete' and x['ocr_text'].strip() for x in rows),year
              (output/f'{slug}.json').write_text(json.dumps(rows,ensure_ascii=False,separators=(',',':')),encoding='utf8')
              parts=output/slug
              parts.mkdir(parents=True,exist_ok=True)
              for start in range(0,n,5):
                  batch=rows[start:start+5]
                  p=parts/f"pages-{batch[0]['page_number']:03d}-{batch[-1]['page_number']:03d}.json"
                  p.write_text(json.dumps(batch,ensure_ascii=False,separators=(',',':')),encoding='utf8')
              print(f'{year}: validated {n} pages; {sum(len(x["ocr_text"]) for x in rows)} characters',flush=True)
          PY
      - name: Commit safely against latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "museum-ocr-bot"
          git config user.email "museum-ocr-bot@users.noreply.github.com"
          git add audit/yearbook-ocr/
          git commit -m "Preserve seven EWSCA yearbook OCR masters and page import chunks"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
