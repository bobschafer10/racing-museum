name: Supabase to R2 source access preflight (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-source-and-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - name: Test source read and R2 pilot read without writes
        env:
          SUPABASE_URL: ${{ secrets.MIGRATION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MIGRATION_SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.MIGRATION_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.MIGRATION_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.MIGRATION_R2_SECRET_ACCESS_KEY }}
        run: python scripts/check_supabase_r2_source_access.py
