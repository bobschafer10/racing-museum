name: MRN to R2 safe single-issue test
on:
  workflow_dispatch:
    inputs:
      execute_copy:
        description: 'Copy the 8-file test issue (unchecked = dry run)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: mrn-r2-single-issue
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - name: Safely copy and verify 1960-09-21 (8 files)
        env:
          MRN_ISSUE: '1960-09-21'
          EXECUTE_COPY: ${{ inputs.execute_copy && 'yes' || 'no' }}
          SUPABASE_URL: ${{ secrets.MIGRATION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MIGRATION_SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.MIGRATION_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.MIGRATION_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.MIGRATION_R2_SECRET_ACCESS_KEY }}
        run: python scripts/migrate_mrn_safe_test_issue.py
