name: PaddleOCR Newspaper Layout Backfill

on:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-mrn-layout-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: paddleocr-newspaper-layout-backfill
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build publication year quarter matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          rows=[]
          for publication, start, end in [
              ('midwest-racing-news',1959,1978),
              ('checkered-flag-racing-news',1969,1978),
          ]:
              for year in range(start,end+1):
                  for quarter in range(1,5):
                      rows.append({'publication':publication,'year':year,'quarter':quarter})
          with open(sys.argv[1],'a',encoding='utf-8') as f:
              f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          print(f'Prepared {len(rows)} publication/year/quarter OCR geometry backfill jobs')
          PY

  backfill:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out newspaper OCR runner
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: Ask Supabase for pages still missing OCR geometry
        shell: bash
        env:
          PUBLICATION: ${{ matrix.publication }}
          YEAR: ${{ matrix.year }}
          QUARTER: ${{ matrix.quarter }}
        run: |
          set -euo pipefail
          oidc="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$oidc"
          jq -n --arg publication "$PUBLICATION" --argjson year "$YEAR" --argjson quarter "$QUARTER" \
            '{publication:$publication,year:$year,quarter:$quarter}' > /tmp/missing-request.json
          http_code="$(curl -sS -o /tmp/missing.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${oidc}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/missing-request.json \
            'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-layout-missing')"
          cat /tmp/missing.json
          echo
          test "$http_code" -ge 200 -a "$http_code" -lt 300
          jq -e '.ok == true' /tmp/missing.json >/dev/null
          jq -c '.issues[]?' /tmp/missing.json > /tmp/issues.jsonl
          echo "${PUBLICATION} ${YEAR} Q${QUARTER}: $(jq -r '.issue_count' /tmp/missing.json) issues / $(jq -r '.page_count' /tmp/missing.json) pages still need geometry"

      - name: OCR only missing pages and patch geometry only
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          PUBLICATION: ${{ matrix.publication }}
          YEAR: ${{ matrix.year }}
          QUARTER: ${{ matrix.quarter }}
        run: |
          set -euo pipefail
          issue_count=0
          page_count=0
          while IFS= read -r item; do
            test -n "$item" || continue
            issue="$(echo "$item" | jq -r '.issue')"
            pages_json="$(echo "$item" | jq -c '.pages')"
            pages="$(echo "$item" | jq -r '.pages | length')"
            output_root="audit/paddleocr-newspaper-layout/${PUBLICATION}/${issue}"
            echo "=== ${PUBLICATION} ${issue}: repairing ${pages} scan(s) ==="

            NEWSPAPER_PUBLICATION="$PUBLICATION" \
            MRN_ISSUE_DATE="$issue" \
            MRN_PAGES_JSON="$pages_json" \
            MRN_COLUMN_COUNT='5' \
            MRN_OUTPUT_ROOT="$output_root" \
              python museum-newspaper-manager/paddleocr-mrn-runner.py

            rm -rf /tmp/layout-repairs
            mkdir -p /tmp/layout-repairs
            OUTPUT_ROOT="$output_root" PUBLICATION="$PUBLICATION" YEAR="$YEAR" ISSUE="$issue" \
              python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUTPUT_ROOT'])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          out=Path('/tmp/layout-repairs')
          publication=os.environ['PUBLICATION']
          year=int(os.environ['YEAR'])
          issue=os.environ['ISSUE']
          pages=summary.get('pages') or []
          if not pages:
              raise SystemExit('summary.json contains no pages')
          for i,meta in enumerate(pages):
              page=str(meta.get('page') or '')
              lines=((meta.get('line_layout') or {}).get('lines') or [])
              if not page or not lines:
                  raise SystemExit(f'Missing page or line geometry for {page!r}')
              payload={
                  'publication':publication,
                  'year':year,
                  'issue':issue,
                  'page':page,
                  'meta':meta,
                  'summary':summary,
              }
              (out/f'{i:04d}.json').write_text(json.dumps(payload,separators=(',',':')),encoding='utf-8')
              print(page, len(lines), 'layout lines')
          PY

            oidc="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
            test -n "$oidc"
            repaired=0
            for payload_file in /tmp/layout-repairs/*.json; do
              page_name="$(jq -r '.page' "$payload_file")"
              echo "Patching geometry only: ${issue} ${page_name}"
              http_code="$(curl -sS -o /tmp/layout-response.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${oidc}" \
                -H 'Content-Type: application/json' \
                --data-binary @"$payload_file" \
                'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-layout-repair')"
              cat /tmp/layout-response.json
              echo
              test "$http_code" -ge 200 -a "$http_code" -lt 300
              jq -e '.ok == true and (.layout_lines // 0) > 0' /tmp/layout-response.json >/dev/null
              repaired=$((repaired + 1))
            done
            test "$repaired" -eq "$pages"

            issue_count=$((issue_count + 1))
            page_count=$((page_count + pages))
            rm -rf "$output_root" /tmp/layout-repairs
          done < /tmp/issues.jsonl
          echo "Completed geometry-only repair for ${PUBLICATION} ${YEAR} Q${QUARTER}: ${issue_count} issues / ${page_count} scans"
