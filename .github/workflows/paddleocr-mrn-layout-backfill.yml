name: PaddleOCR Newspaper Layout Backfill

on:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-mrn-layout-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: paddleocr-newspaper-layout-backfill
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build publication year quarter matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          rows=[]
          for publication, start, end in [
              ('midwest-racing-news',1959,1978),
              ('checkered-flag-racing-news',1969,1978),
          ]:
              for year in range(start,end+1):
                  for quarter in range(1,5):
                      rows.append({'publication':publication,'year':year,'quarter':quarter})
          with open(sys.argv[1],'a',encoding='utf-8') as f:
              f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          print(f'Prepared {len(rows)} publication/year/quarter OCR backfill jobs')
          PY

  backfill:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out newspaper OCR runner
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: Build issue list for this quarter
        shell: bash
        env:
          PUBLICATION: ${{ matrix.publication }}
          YEAR: ${{ matrix.year }}
          QUARTER: ${{ matrix.quarter }}
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/public/data/newspapers-manifest.json" \
            -o /tmp/newspapers-manifest.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          publication=os.environ['PUBLICATION']
          year=int(os.environ['YEAR'])
          quarter=int(os.environ['QUARTER'])
          start_month=(quarter-1)*3+1
          end_month=start_month+2
          image_re=re.compile(r'.+\.(?:jpg|jpeg|png|webp)$', re.I)
          manifest=json.loads(Path('/tmp/newspapers-manifest.json').read_text(encoding='utf-8'))
          rows=[]
          for issue in manifest:
              if issue.get('publicationSlug') != publication or int(issue.get('year') or 0) != year:
                  continue
              issue_date=str(issue.get('issueDate') or issue.get('slug') or '')
              match=re.fullmatch(r'(\d{4})-(\d{2})-(\d{2})',issue_date)
              if not match or int(match.group(1)) != year or not (start_month <= int(match.group(2)) <= end_month):
                  continue
              urls=[]
              for value in [issue.get('coverImage'), *(issue.get('pages') or []), issue.get('backCoverImage')]:
                  if isinstance(value,str) and value:
                      urls.append(value)
              pages=[]
              seen=set()
              for url in urls:
                  filename=unquote(urlparse(url).path.split('/')[-1])
                  if filename.lower() in {'thumbnail.jpg','thumbnail.jpeg','thumbnail.png','thumbnail.webp'}:
                      continue
                  if not image_re.fullmatch(filename) or '/' in filename or '\\' in filename or filename in {'.','..'}:
                      continue
                  if filename in seen:
                      continue
                  seen.add(filename)
                  pages.append(filename)
              if pages:
                  rows.append({'issue':issue_date,'pages':pages})
          rows.sort(key=lambda row:row['issue'])
          with Path('/tmp/issues.jsonl').open('w',encoding='utf-8') as f:
              for row in rows:
                  f.write(json.dumps(row,separators=(',',':'))+'\n')
          print(f'{publication} {year} Q{quarter}: {len(rows)} issues / {sum(len(r["pages"]) for r in rows)} scans')
          PY

      - name: OCR and ingest missing layout metadata
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          PUBLICATION: ${{ matrix.publication }}
          YEAR: ${{ matrix.year }}
          QUARTER: ${{ matrix.quarter }}
        run: |
          set -euo pipefail
          issue_count=0
          page_count=0
          while IFS= read -r item; do
            test -n "$item" || continue
            issue="$(echo "$item" | jq -r '.issue')"
            pages_json="$(echo "$item" | jq -c '.pages')"
            pages="$(echo "$item" | jq -r '.pages | length')"
            output_root="audit/paddleocr-newspaper-layout/${PUBLICATION}/${issue}"
            echo "=== ${PUBLICATION} ${issue}: ${pages} scans ==="

            NEWSPAPER_PUBLICATION="$PUBLICATION" \
            MRN_ISSUE_DATE="$issue" \
            MRN_PAGES_JSON="$pages_json" \
            MRN_COLUMN_COUNT='5' \
            MRN_OUTPUT_ROOT="$output_root" \
              python museum-newspaper-manager/paddleocr-mrn-runner.py

            OUTPUT_ROOT="$output_root" PUBLICATION="$PUBLICATION" YEAR="$YEAR" ISSUE="$issue" \
              python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUTPUT_ROOT'])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')) if (root/'candidates.json').exists() else []
          pages=[]
          for meta in summary.get('pages',[]):
              page=str(meta['page'])
              stem=Path(page).stem
              text=(root/'text'/f'{stem}-columns.txt').read_text(encoding='utf-8')
              pages.append({'page':page,'text':text,'meta':meta})
          payload={
              'publication':os.environ['PUBLICATION'],
              'year':int(os.environ['YEAR']),
              'issue':os.environ['ISSUE'],
              'summary':summary,
              'pages':pages,
              'candidates':candidates,
          }
          Path('/tmp/ocr-payload.json').write_text(json.dumps(payload,separators=(',',':')),encoding='utf-8')
          PY

            oidc="$(curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
            test -n "$oidc"
            response="$(curl -fsSL \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              -X POST \
              -H "Authorization: Bearer ${oidc}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/ocr-payload.json \
              'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-import')"
            echo "$response"
            test "$(echo "$response" | jq -r '.ok')" = 'true'
            test "$(echo "$response" | jq -r '.updated')" -eq "$pages"

            issue_count=$((issue_count + 1))
            page_count=$((page_count + pages))
            rm -rf "$output_root"
          done < /tmp/issues.jsonl
          echo "Completed ${PUBLICATION} ${YEAR} Q${QUARTER}: ${issue_count} issues / ${page_count} scans"
