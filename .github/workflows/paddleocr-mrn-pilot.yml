name: PaddleOCR MRN 1959 Pilot

on:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - 'museum-newspaper-manager/paddleocr-mrn-runner.py'
      - '.github/workflows/paddleocr-mrn-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out OCR runner only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: Run June 3 1959 validation
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          MRN_ISSUE_DATE: '1959-06-03'
          MRN_PAGE_COUNT: '8'
          MRN_OUTPUT_ROOT: 'audit/paddleocr-mrn-1959/1959-06-03'
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Upload OCR validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddleocr-mrn-1959-06-03-v2
          path: audit/paddleocr-mrn-1959/1959-06-03
          if-no-files-found: warn
          retention-days: 1
