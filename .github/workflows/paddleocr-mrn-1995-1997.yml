name: PaddleOCR MRN 1995-1997

on:
  workflow_dispatch:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-mrn-1995-1997.yml'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      issue_count: ${{ steps.matrix.outputs.issue_count }}
      page_count: ${{ steps.matrix.outputs.page_count }}
    steps:
      - name: Build verified 1995-1997 issue matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          raw = '''
          1995-01-12,16
          1995-02-09,16
          1995-03-09,20
          1995-04-13,20
          1995-04-20,16
          1995-04-27,16
          1995-05-04,16
          1995-05-11,20
          1995-05-18,16
          1995-05-25,24
          1995-06-01,20
          1995-06-08,20
          1995-06-15,20
          1995-06-22,24
          1995-06-29,24
          1995-07-06,24
          1995-07-13,20
          1995-07-20,20
          1995-07-27,20
          1995-08-03,24
          1995-08-10,20
          1995-08-17,20
          1995-08-24,20
          1995-08-31,20
          1995-09-07,20
          1995-09-14,20
          1995-09-21,16
          1995-10-05,20
          1995-12-07,44
          1996-01-11,16
          1996-02-08,20
          1996-03-07,20
          1996-04-11,20
          1996-04-18,16
          1996-04-25,16
          1996-05-02,16
          1996-05-09,20
          1996-05-16,20
          1996-05-23,20
          1996-05-30,24
          1996-06-06,16
          1996-06-13,20
          1996-06-20,24
          1996-06-27,24
          1996-07-04,20
          1996-07-11,20
          1996-07-18,20
          1996-07-25,20
          1996-08-01,20
          1996-08-08,20
          1996-08-15,24
          1996-08-22,20
          1996-08-29,20
          1996-09-05,20
          1996-09-12,20
          1996-09-19,16
          1996-10-03,16
          1996-11-07,24
          1996-12-12,48
          1997-01-16,20
          1997-02-06,16
          1997-03-06,24
          1997-04-10,24
          1997-04-17,16
          1997-04-24,16
          1997-05-01,20
          1997-05-08,16
          1997-05-15,20
          1997-05-22,24
          1997-05-29,20
          1997-06-05,24
          1997-06-12,20
          1997-06-19,20
          1997-06-26,24
          1997-07-03,24
          1997-07-10,24
          1997-07-17,24
          1997-07-24,20
          1997-07-31,20
          1997-08-07,24
          1997-08-14,24
          1997-08-21,20
          1997-08-28,20
          1997-09-04,20
          1997-09-11,20
          1997-09-18,16
          1997-10-02,16
          1997-11-06,24
          1997-12-11,52
          '''

          rows=[]
          total_pages=0
          for line in raw.splitlines():
              line=line.strip()
              if not line:
                  continue
              issue, spec = line.split(',', 1)
              year=int(issue[:4])
              count=int(spec)
              pages=[f'{n:03d}.jpg' for n in range(1, count + 1)]
              rows.append({
                  'year': year,
                  'issue': issue,
                  'pages_json': json.dumps(pages, separators=(',', ':')),
                  'page_count': count,
              })
              total_pages += count

          if len(rows) != 89 or total_pages != 1868:
              raise SystemExit(f'Control matrix mismatch: {len(rows)} issues / {total_pages} pages')

          controls={1995:(29,596),1996:(30,620),1997:(30,652)}
          for year, (expected_issues, expected_pages) in controls.items():
              year_rows=[r for r in rows if r['year']==year]
              actual_pages=sum(r['page_count'] for r in year_rows)
              if len(year_rows) != expected_issues or actual_pages != expected_pages:
                  raise SystemExit(
                      f'{year} control mismatch: {len(year_rows)} issues / {actual_pages} pages '
                      f'!= {expected_issues} / {expected_pages}'
                  )

          matrix=json.dumps({'include':rows}, separators=(',', ':'))
          print(f'MRN 1995-1997: {len(rows)} issues / {total_pages} stored numbered pages')
          print('NOTE: 1995 currently contains 29 stored issues; no November 1995 issue is present in Storage.')
          out=Path(sys.argv[1])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'issue_count={len(rows)}\n')
              f.write(f'page_count={total_pages}\n')
              f.write(f'matrix={matrix}\n')
          PY

  ocr_and_ingest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out OCR runner only
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR ${{ matrix.issue }}
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          NEWSPAPER_PUBLICATION: midwest-racing-news
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGES_JSON: ${{ matrix.pages_json }}
          MRN_OUTPUT_ROOT: audit/paddleocr-mrn-1995-1997/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ingest searchable OCR and standings candidates
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          ISSUE: ${{ matrix.issue }}
          EXPECTED_PAGES: ${{ matrix.page_count }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ISSUE_DIR: audit/paddleocr-mrn-1995-1997/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python - "$ISSUE_DIR" "$YEAR" > /tmp/ocr-payload.json <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          year=int(sys.argv[2])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')) if (root/'candidates.json').exists() else []
          pages=[]
          for meta in summary.get('pages',[]):
              page=str(meta['page'])
              stem=Path(page).stem
              text=(root/'text'/f'{stem}-columns.txt').read_text(encoding='utf-8')
              pages.append({'page':page,'text':text,'meta':meta})
          print(json.dumps({
              'publication':'midwest-racing-news',
              'year':year,
              'issue':summary['issue_date'],
              'summary':summary,
              'pages':pages,
              'candidates':candidates,
          }, separators=(',',':')))
          PY
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ocr-payload.json \
            'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-import')"
          echo "$ISSUE: $response"
          updated="$(echo "$response" | jq -r '.updated // 0')"
          test "$updated" -eq "$EXPECTED_PAGES"

      - name: Upload OCR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-${{ matrix.issue }}
          path: audit/paddleocr-mrn-1995-1997/${{ matrix.issue }}
          if-no-files-found: warn
          retention-days: 14
