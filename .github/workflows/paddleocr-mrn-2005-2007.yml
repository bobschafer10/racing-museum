name: PaddleOCR MRN 2005-2007

on:
  workflow_dispatch:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - 'ocr-jobs/mrn-2005-2007-start.txt'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      issue_count: ${{ steps.matrix.outputs.issue_count }}
      page_count: ${{ steps.matrix.outputs.page_count }}
    steps:
      - name: Build verified 2005-2007 issue matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          raw = '''
          2005-01-12,1,20
          2005-02-09,1,20
          2005-02-23,1,16
          2005-03-09,1,16
          2005-03-23,1,16
          2005-04-06,1,20
          2005-04-13,1,24
          2005-04-20,1,16
          2005-04-27,1,16
          2005-05-04,1,20
          2005-05-11,1,16
          2005-05-18,1,16
          2005-05-25,1,20
          2005-06-01,1,24
          2005-06-08,1,20
          2005-06-15,1,20
          2005-06-22,1,20
          2005-06-29,1,19
          2005-07-06,1,20
          2005-07-13,1,20
          2005-07-20,1,24
          2005-07-27,1,20
          2005-08-03,1,24
          2005-08-10,1,20
          2005-08-17,1,20
          2005-08-24,1,24
          2005-08-31,1,20
          2005-09-07,1,20
          2005-09-14,1,20
          2005-09-21,1,20
          2005-09-28,1,20
          2005-10-05,1,16
          2005-10-19,1,28
          2005-11-02,1,24
          2005-11-16,1,20
          2005-12-07,1,32
          2006-01-18,1,20
          2006-02-01,1,16
          2006-02-22,1,16
          2006-03-08,1,16
          2006-03-22,1,16
          2006-04-05,1,16
          2006-04-12,1,20
          2006-04-19,1,24
          2006-04-26,1,16
          2006-05-03,1,16
          2006-05-10,1,16
          2006-05-17,1,16
          2006-05-24,1,20
          2006-05-31,1,20
          2006-06-07,1,24
          2006-06-14,1,20
          2006-06-21,1,20
          2006-06-28,1,20
          2006-07-05,1,20
          2006-07-12,1,20
          2006-07-19,1,20
          2006-07-26,1,20
          2006-08-02,1,16
          2006-08-09,1,16
          2006-08-16,1,16
          2006-08-23,1,16
          2006-08-30,1,16
          2006-09-06,1,16
          2006-09-13,1,16
          2006-09-20,1,16
          2006-09-27,1,16
          2006-10-04,1,16
          2006-10-18,1,16
          2006-11-01,1,16
          2007-02-28,1,8
          2007-06-13,1,8
          2007-06-20,1,8
          2007-06-27,1,8
          2007-07-04,1,8
          2007-07-11,1,8
          2007-07-18,1,8
          2007-07-25,1,8
          2007-08-01,1,8
          '''

          rows=[]
          total_pages=0
          for line in raw.splitlines():
              line=line.strip()
              if not line:
                  continue
              issue, start_s, count_s = line.split(',', 2)
              year=int(issue[:4])
              start=int(start_s)
              count=int(count_s)
              pages=[f'{n:03d}.jpg' for n in range(start, start + count)]
              rows.append({
                  'year': year,
                  'issue': issue,
                  'pages_json': json.dumps(pages, separators=(',', ':')),
                  'page_count': count,
              })
              total_pages += count

          if len(rows) != 79 or total_pages != 1407:
              raise SystemExit(f'Control matrix mismatch: {len(rows)} issues / {total_pages} pages')

          controls={2005:(36,731),2006:(34,604),2007:(9,72)}
          for year, (expected_issues, expected_pages) in controls.items():
              year_rows=[r for r in rows if r['year']==year]
              actual_pages=sum(r['page_count'] for r in year_rows)
              if len(year_rows) != expected_issues or actual_pages != expected_pages:
                  raise SystemExit(
                      f'{year} control mismatch: {len(year_rows)} issues / {actual_pages} pages '
                      f'!= {expected_issues} / {expected_pages}'
                  )

          matrix=json.dumps({'include':rows}, separators=(',', ':'))
          print(f'MRN 2005-2007: {len(rows)} issues / {total_pages} stored numbered pages')
          out=Path(sys.argv[1])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'issue_count={len(rows)}\n')
              f.write(f'page_count={total_pages}\n')
              f.write(f'matrix={matrix}\n')
          PY

  ocr_and_ingest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out OCR runner only
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR ${{ matrix.issue }}
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          NEWSPAPER_PUBLICATION: midwest-racing-news
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGES_JSON: ${{ matrix.pages_json }}
          MRN_OUTPUT_ROOT: audit/paddleocr-mrn-2005-2007/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ingest searchable OCR and standings candidates
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          ISSUE: ${{ matrix.issue }}
          EXPECTED_PAGES: ${{ matrix.page_count }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ISSUE_DIR: audit/paddleocr-mrn-2005-2007/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python - "$ISSUE_DIR" "$YEAR" > /tmp/ocr-payload.json <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          year=int(sys.argv[2])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')) if (root/'candidates.json').exists() else []
          pages=[]
          for meta in summary.get('pages',[]):
              page=str(meta['page'])
              stem=Path(page).stem
              text=(root/'text'/f'{stem}-columns.txt').read_text(encoding='utf-8')
              pages.append({'page':page,'text':text,'meta':meta})
          print(json.dumps({
              'publication':'midwest-racing-news',
              'year':year,
              'issue':summary['issue_date'],
              'summary':summary,
              'pages':pages,
              'candidates':candidates,
          }, separators=(',',':')))
          PY
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ocr-payload.json \
            'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-import')"
          echo "$ISSUE: $response"
          updated="$(echo "$response" | jq -r '.updated // 0')"
          test "$updated" -eq "$EXPECTED_PAGES"

      - name: Upload OCR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-${{ matrix.issue }}
          path: audit/paddleocr-mrn-2005-2007/${{ matrix.issue }}
          if-no-files-found: warn
          retention-days: 14
