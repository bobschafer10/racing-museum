name: Recover CFRN 1992 and 1995 stored OCR

on:
  push:
    paths:
      - '.github/workflows/recover-cfrn-1992-1995-pagebreaks.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [1992, 1995]
    env:
      YEAR: ${{ matrix.year }}
    steps:
      - name: Validate page boundaries and ingest searchable OCR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.request, urllib.error

          PROJECT='szvkleurojiwqkkztxtr'
          PUB='checkered-flag-racing-news'
          YEAR=int(os.environ['YEAR'])
          ROOT=f'https://{PROJECT}.supabase.co/storage/v1/object/public/media/newspapers/{PUB}'
          IMPORT=f'https://{PROJECT}.supabase.co/functions/v1/newspaper-ocr-import'
          OIDC_URL=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          OIDC_REQ=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']

          issue_counts={
            1992:{
              '1992-01-08':16,'1992-02-05':20,'1992-03-18':16,'1992-04-08':36,'1992-04-15':16,
              '1992-04-22':20,'1992-04-29':24,'1992-05-06':28,'1992-06-17':36,'1992-07-01':40,
              '1992-07-15':28,'1992-08-19':36,'1992-08-26':36,'1992-09-09':32,'1992-09-30':20,
              '1992-10-07':20,'1992-12-09':19,
            },
            1995:{
              '1995-04-05':24,'1995-04-26':24,'1995-05-10':28,'1995-05-17':24,'1995-05-31':28,
              '1995-06-07':32,'1995-06-14':28,'1995-06-21':36,'1995-06-28':36,'1995-07-05':40,
              '1995-07-12':36,'1995-07-26':36,'1995-08-02':36,'1995-08-09':36,'1995-08-23':40,
              '1995-08-30':36,'1995-09-06':36,'1995-09-13':32,'1995-09-27':20,'1995-10-18':24,
            },
          }[YEAR]

          def get(url, timeout=90, attempts=5):
              last=None
              for a in range(1,attempts+1):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'UMARM CFRN pagebreak recovery/1.0'})
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          return r.read()
                  except Exception as e:
                      last=e
                      if a<attempts: time.sleep(min(a*3,12))
              raise RuntimeError(f'GET failed {url}: {last}')

          def split_issue(issue, expected):
              raw=get(f'{ROOT}/{issue}/ocr.txt').decode('utf-8','replace').replace('\r\n','\n').replace('\r','\n').strip()
              pages=[p.strip() for p in re.split(r'(?<!\n)\n{3}(?!\n)',raw) if p.strip()]
              if len(pages)!=expected:
                  raise RuntimeError(f'{issue}: expected {expected} pages from triple-newline delimiters, found {len(pages)}')
              if any(len(p)<20 for p in pages):
                  raise RuntimeError(f'{issue}: suspiciously short OCR page after split')
              return pages

          # Validate the entire year BEFORE writing anything.
          cache={}
          total_expected=0
          for issue,expected in issue_counts.items():
              pages=split_issue(issue,expected)
              cache[issue]=pages
              total_expected+=expected
              print(f'VALIDATED {issue}: {expected} page sections / {sum(len(x) for x in pages)} chars',flush=True)
          print(f'YEAR VALIDATED {YEAR}: {len(cache)} issues / {total_expected} pages',flush=True)

          def oidc():
              sep='&' if '?' in OIDC_URL else '?'
              req=urllib.request.Request(
                  f'{OIDC_URL}{sep}audience=umarm-newspaper-ocr-import',
                  headers={'Authorization':f'bearer {OIDC_REQ}','User-Agent':'UMARM CFRN pagebreak recovery/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  token=json.loads(r.read().decode()).get('value')
              if not token: raise RuntimeError('OIDC token missing')
              return token

          def send(issue, page_numbers, texts, attempts=4):
              payload={
                  'publication':PUB,'year':YEAR,'issue':issue,
                  'summary':{'engine':'Stored OCR text import','recognition_model':'prepared CFRN OCR triple-newline page sections'},
                  'pages':[
                      {'page':f'{n:03d}.jpg','text':txt,'meta':{
                          'source':'stored-ocr.txt','import_mode':'triple-newline-page-sections','scan_position':n,
                          'line_layout':{'lines':[]}}}
                      for n,txt in zip(page_numbers,texts)
                  ],
                  'candidates':[],
              }
              body=json.dumps(payload,separators=(',',':')).encode()
              last=None
              for a in range(1,attempts+1):
                  try:
                      req=urllib.request.Request(IMPORT,data=body,method='POST',headers={
                          'Authorization':f'Bearer {oidc()}','Content-Type':'application/json',
                          'User-Agent':'UMARM CFRN pagebreak recovery/1.0'})
                      with urllib.request.urlopen(req,timeout=180) as r:
                          out=json.loads(r.read().decode())
                      if out.get('ok') and int(out.get('updated',0))==len(page_numbers):
                          return out
                      last=RuntimeError(f'bad importer response {out}')
                  except urllib.error.HTTPError as e:
                      last=RuntimeError(f'HTTP {e.code}: {e.read().decode("utf-8","replace")}')
                  except Exception as e:
                      last=e
                  if a<attempts: time.sleep(min(a*4,16))
              raise RuntimeError(str(last))

          def import_adaptive(issue, nums, texts):
              try:
                  out=send(issue,nums,texts)
                  print(f'INDEXED {issue} pages {nums[0]:03d}-{nums[-1]:03d}: {len(nums)} rows',flush=True)
                  return len(nums)
              except Exception as e:
                  if len(nums)==1:
                      raise
                  mid=len(nums)//2
                  print(f'SPLIT {issue} pages {nums[0]:03d}-{nums[-1]:03d} after {e}',flush=True)
                  return import_adaptive(issue,nums[:mid],texts[:mid])+import_adaptive(issue,nums[mid:],texts[mid:])

          completed=0
          for issue,pages in cache.items():
              n=len(pages)
              done=0
              for start in range(0,n,4):
                  nums=list(range(start+1,min(start+4,n)+1))
                  texts=[pages[i-1] for i in nums]
                  done += import_adaptive(issue,nums,texts)
                  time.sleep(0.35)
              if done!=n: raise RuntimeError(f'{issue}: wrote {done}, expected {n}')
              completed += done
              print(f'ISSUE COMPLETE {issue}: {done} searchable pages',flush=True)
          if completed!=total_expected:
              raise RuntimeError(f'Year {YEAR}: wrote {completed}, expected {total_expected}')
          print(json.dumps({'ok':True,'year':YEAR,'issues':len(cache),'pages':completed},indent=2),flush=True)
          PY
