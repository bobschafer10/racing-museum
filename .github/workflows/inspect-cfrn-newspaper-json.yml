name: Inspect CFRN newspaper JSON

on:
  push:
    paths:
      - '.github/workflows/inspect-cfrn-newspaper-json.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect stored OCR structure
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          base='https://szvkleurojiwqkkztxtr.supabase.co/storage/v1/object/public/media/newspapers/checkered-flag-racing-news/1999-01-20'
          req=urllib.request.Request(base+'/ocr.txt',headers={'User-Agent':'UMARM OCR inspector/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              raw=r.read()
          text=raw.decode('utf-8','replace')
          print('BYTES',len(raw),'CHARS',len(text),'FORM_FEEDS',text.count('\f'))
          lines=text.replace('\r\n','\n').replace('\r','\n').split('\n')
          print('LINES',len(lines))
          print('FIRST_40_LINES')
          for i,line in enumerate(lines[:40],1):
              print(f'{i:03d}: {line[:300]}')
          pats=[
              r'(?i)^.*(?:page|scan|image|file).*\b0*1\b.*$',
              r'(?i)^.*\.jpe?g.*$',
              r'^[-=]{3,}.*$',
          ]
          for pat in pats:
              hits=[]
              rx=re.compile(pat)
              for i,line in enumerate(lines,1):
                  if rx.search(line.strip()):
                      hits.append((i,line[:300]))
                      if len(hits)>=50: break
              print('PATTERN',pat,'HITS',len(hits))
              for h in hits[:20]: print(h)
          PY