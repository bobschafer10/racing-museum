name: Fix newspaper viewer fallback

on:
  push:
    paths:
      - '.github/workflows/fix-newspaper-viewer-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add native page-opening fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/media/newspapers/[publication]/[issue]/NewspaperPageViewer.tsx')
          s = p.read_text(encoding='utf-8')
          old_open = '<button type="button" style={openIssueButton} onClick={() => {'
          new_open = '<a href={pages[0]?.image || "#"} target="_blank" rel="noreferrer" style={{...openIssueButton,textDecoration:\'none\',display:\'inline-flex\',alignItems:\'center\'}} onClick={(event) => {\n        if (!pages.length) return\n        event.preventDefault()'
          old_close = '}}>Read full newspaper →</button>'
          new_close = '}}>Read full newspaper →</a>'
          if old_open in s and old_close in s:
              s = s.replace(old_open, new_open, 1).replace(old_close, new_close, 1)
              p.write_text(s, encoding='utf-8')
          elif 'href={pages[0]?.image || "#"}' in s:
              print('Native fallback already installed')
          else:
              raise SystemExit('Expected viewer button markup was not found')
          PY

      - name: Commit viewer fallback
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'app/media/newspapers/[publication]/[issue]/NewspaperPageViewer.tsx'; then
            echo 'No viewer changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/media/newspapers/[publication]/[issue]/NewspaperPageViewer.tsx'
          git commit -m 'Make newspaper viewer open page without hydration'
          git push origin HEAD:main
