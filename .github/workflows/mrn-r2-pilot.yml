name: MRN to R2 pilot (manual only)
on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'MRN issue date (YYYY-MM-DD)'
        required: true
        type: string
      execute_copy:
        description: 'Copy and verify (false = dry run)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - name: Copy and verify one MRN issue
        env:
          MRN_ISSUE: ${{ inputs.issue_date }}
          EXECUTE_COPY: ${{ inputs.execute_copy && 'yes' || 'no' }}
          SUPABASE_URL: ${{ secrets.MIGRATION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MIGRATION_SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.MIGRATION_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.MIGRATION_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.MIGRATION_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: umarm-newspapers
        run: python scripts/migrate_mrn_issue_to_r2.py
