name: temp-series-logo-batch4-assets
on:
  push:
    branches:
      - temp/series-logo-pack-20260918
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Retrieve Batch 4 assets
        run: |
          cat > /tmp/b4a.py <<'PY'
          
          import requests, io, csv, shutil
          from pathlib import Path
          from PIL import Image
          ROOT=Path("batch4_assets"); ROOT.mkdir(exist_ok=True)
          S=requests.Session(); S.headers.update({"User-Agent":"Mozilla/5.0 UMARM Logo Research"})
          assets=[
          ("american-stockcar-league-alt","https://i.ebayimg.com/images/g/4KAAAOSwvJ9fuYTR/s-l500.webp","Second period American Stockcar League patch image from exact listing"),
          ("usar-hooters-late-model-series","http://www.thethirdturn.com/w/images/1/15/USAR_Hooters_Late_Model_Series.jpg","The Third Turn exact historical series image"),
          ("asa-national-tour-acdelco-2000-2004","https://static.wikia.nocookie.net/iracing/images/a/a2/ASAACDelcoSerieslogo20002004.png/revision/latest?cb=20260205194235","ASA ACDelco Challenge Series / National Tour era logo"),
          ("trans-am-standard","https://upload.wikimedia.org/wikipedia/en/0/0e/The_logo_of_the_SCCA_Trans_Am_Series.jpg","Standard SCCA Trans-Am Series logo"),
          ]
          rows=[]
          for stem,url,note in assets:
              try:
                  r=S.get(url,timeout=40,allow_redirects=True); r.raise_for_status()
                  data=r.content
                  im=Image.open(io.BytesIO(data)); im.load()
                  ext={"PNG":".png","JPEG":".jpg","WEBP":".webp","GIF":".gif"}.get(im.format,".png")
                  p=ROOT/(stem+ext); p.write_bytes(data)
                  rows.append([stem,url,note,p.name,f"{im.width}x{im.height}","ok"])
              except Exception as e:
                  rows.append([stem,url,note,"","",repr(e)])
          with open(ROOT/"manifest.csv","w",newline="",encoding="utf-8") as f:
              w=csv.writer(f);w.writerow(["stem","url","note","file","size","status"]);w.writerows(rows)
          shutil.make_archive("UMARM_batch4_assets","zip",ROOT)
          print(rows)
          
          PY
          python /tmp/b4a.py
      - uses: actions/upload-artifact@v4
        with:
          name: UMARM-batch4-assets
          path: UMARM_batch4_assets.zip
          retention-days: 7
