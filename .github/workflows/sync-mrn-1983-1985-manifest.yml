name: Sync MRN 1983-1985 to Museum

on:
  workflow_dispatch:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/sync-mrn-1983-1985-manifest.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified inventory
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          path: tools
          sparse-checkout: |
            ocr-jobs/mrn-1983-1985-inventory.json
          sparse-checkout-cone-mode: false

      - name: Check out museum main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ github.token }}

      - name: Merge verified Supabase issues into museum manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import quote

          PROJECT='https://szvkleurojiwqkkztxtr.supabase.co'
          BUCKET='media'
          PUB='midwest-racing-news'
          PUB_NAME='Midwest Racing News'

          inv=json.loads(Path('tools/ocr-jobs/mrn-1983-1985-inventory.json').read_text(encoding='utf-8'))
          manifest_path=Path('site/public/data/newspapers-manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))

          target_keys={(PUB,row['issue_date']) for row in inv['issues']}
          manifest=[x for x in manifest if (str(x.get('publicationSlug') or ''),str(x.get('issueDate') or x.get('slug') or '')) not in target_keys]

          def base_url(date):
              return f'{PROJECT}/storage/v1/object/public/{BUCKET}/newspapers/{PUB}/{date}/'

          def fetch_metadata(date):
              url=base_url(date)+'newspaper.json'
              last=None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'UMARM manifest sync/1.0'})
                      with urllib.request.urlopen(req,timeout=45) as res:
                          return json.loads(res.read().decode('utf-8'))
                  except Exception as exc:
                      last=exc
                      time.sleep(2*(attempt+1))
              raise RuntimeError(f'Failed metadata fetch for {date}: {last}')

          added=[]
          for row in inv['issues']:
              date=row['issue_date']
              year=int(date[:4])
              page_count=int(row['page_count'])
              files=[f'{n:03d}.jpg' for n in range(1,page_count+1)]
              b=base_url(date)
              m=fetch_metadata(date)
              dt=datetime.strptime(date,'%Y-%m-%d')
              pretty=f'{dt.strftime("%B")} {dt.day}, {dt.year}'

              entry={
                  'slug': m.get('slug') or date,
                  'title': m.get('title') or pretty,
                  'publication': m.get('publication') or PUB_NAME,
                  'publicationSlug': PUB,
                  'year': year,
                  'issueDate': m.get('issueDate') or date,
                  'description': m.get('description'),
                  'summary': m.get('summary') or f'This {pretty} issue of {PUB_NAME} preserves regional short-track racing coverage from the Upper Midwest, including race reports, photographs, schedules, advertisements, and period racing news from the season.',
                  'highlights': m.get('highlights') or [],
                  'rawOcrHighlights': m.get('rawOcrHighlights') or [],
                  'topics': m.get('topics') or ['Newspaper Coverage'],
                  'ocrConfidence': m.get('ocrConfidence'),
                  'coverImage': m.get('coverImage') if str(m.get('coverImage') or '').startswith('http') else b+'front-cover.jpg',
                  'backCoverImage': m.get('backCoverImage') if str(m.get('backCoverImage') or '').startswith('http') else b+'back-cover.jpg',
                  'thumbnail': m.get('thumbnail') if str(m.get('thumbnail') or '').startswith('http') else b+'thumbnail.jpg',
                  'pages': [b+quote(name,safe='-._~') for name in files],
                  'featured': bool(m.get('featured',False)),
              }
              if m.get('volume') is not None:
                  entry['volume']=m['volume']
              if m.get('number') is not None:
                  entry['number']=m['number']
              manifest.append(entry)
              added.append(entry)

          manifest.sort(key=lambda x:(str(x.get('publicationSlug') or ''),str(x.get('issueDate') or x.get('slug') or '')))

          expected={1983:(28,500),1984:(30,596),1985:(30,556)}
          for year,(expected_issues,expected_pages) in expected.items():
              rows=[x for x in added if int(x['year'])==year]
              pages=sum(len(x.get('pages') or []) for x in rows)
              print(f'MRN {year}: {len(rows)} issues / {pages} pages')
              if len(rows)!=expected_issues or pages!=expected_pages:
                  raise SystemExit(f'Verification failed for MRN {year}')

          if len(added)!=88 or sum(len(x['pages']) for x in added)!=1652:
              raise SystemExit('Overall MRN 1983-1985 verification failed')

          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          manager=Path('site/museum-newspaper-manager/public/data/newspapers-manifest.json')
          manager.parent.mkdir(parents=True,exist_ok=True)
          manager.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print(f'Added/updated {len(added)} verified MRN issues / {sum(len(x["pages"]) for x in added)} pages')
          PY

      - name: Commit museum manifest to main
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UMARM Newspaper Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/newspapers-manifest.json museum-newspaper-manager/public/data/newspapers-manifest.json
          if git diff --cached --quiet; then
            echo 'Museum newspaper manifest already current.'
          else
            git commit -m 'Add verified MRN 1983-1985 issues to museum'
            git push origin HEAD:main
          fi
