name: Enforce Museum 12-Hour Cache

on:
  push:
    paths:
      - '.github/workflows/enforce-museum-cache.yml'

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out museum
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Raise page refresh intervals to 12 hours
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          floor = 43_200
          pattern = re.compile(r'(export\s+const\s+revalidate\s*=\s*)(\d+)')
          changed = []

          for path in Path('app').rglob('*.tsx'):
              if 'api' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')

              def replace(match):
                  current = int(match.group(2))
                  if current >= floor:
                      return match.group(0)
                  return f'{match.group(1)}{floor}'

              updated = pattern.sub(replace, text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} files to a minimum 12-hour revalidation interval.')
          for path in changed:
              print(path)
          PY

      - name: Commit cache changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No page cache changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Raise museum page refresh interval to 12 hours'
          git push origin HEAD:main
