name: Inspect CFRN 1995-07-26 OCR boundary

on:
  push:
    paths:
      - '.github/workflows/inspect-cfrn-1995-07-26-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Locate missing page separator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          url='https://szvkleurojiwqkkztxtr.supabase.co/storage/v1/object/public/media/newspapers/checkered-flag-racing-news/1995-07-26/ocr.txt'
          with urllib.request.urlopen(url,timeout=60) as r:
              text=r.read().decode('utf-8','replace').replace('\r\n','\n').replace('\r','\n').strip()
          chunks=[c.strip() for c in re.split(r'(?<!\n)\n{3}(?!\n)',text) if c.strip()]
          print('chunks',len(chunks),'chars',len(text))
          for i,c in enumerate(chunks,1):
              lines=[x.strip() for x in c.splitlines() if x.strip()]
              markers=[]
              for j,line in enumerate(lines):
                  if re.fullmatch(r'(?i)page\s*\d{1,2}',line) or re.fullmatch(r'(?i)page\s*[sS]',line):
                      markers.append((j,line))
              print(f'CHUNK {i:02d} chars={len(c)} lines={len(lines)} markers={markers}')
              if len(markers)>1 or len(c)>25000:
                  print('---SUSPECT CHUNK START---')
                  for j,line in enumerate(lines):
                      if any(abs(j-m[0])<=6 for m in markers):
                          print(f'{j:04d}: {line[:240]}')
                  print('---SUSPECT CHUNK END---')
          PY
