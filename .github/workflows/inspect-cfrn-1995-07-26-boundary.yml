name: Inspect CFRN 1995-07-26 OCR boundary

on:
  push:
    paths:
      - '.github/workflows/inspect-cfrn-1995-07-26-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect suspected page 10-11 merge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          url='https://szvkleurojiwqkkztxtr.supabase.co/storage/v1/object/public/media/newspapers/checkered-flag-racing-news/1995-07-26/ocr.txt'
          with urllib.request.urlopen(url,timeout=60) as r:
              text=r.read().decode('utf-8','replace').replace('\r\n','\n').replace('\r','\n').strip()
          chunks=[c.strip() for c in re.split(r'(?<!\n)\n{3}(?!\n)',text) if c.strip()]
          c=chunks[9]
          lines=[x.strip() for x in c.splitlines() if x.strip()]
          print('SUSPECT CHUNK 10 chars',len(c),'nonblank lines',len(lines))
          pats=re.compile(r'(?i)(page|july|1995|checkered|flag|racing news|vol\.|watertown|usps|continued|classified)')
          for i,line in enumerate(lines):
              if pats.search(line):
                  lo=max(0,i-4); hi=min(len(lines),i+5)
                  print(f'--- match at {i}: {line[:240]} ---')
                  for j in range(lo,hi): print(f'{j:04d}: {lines[j][:240]}')
          print('--- every 25th line for structure ---')
          for i in range(0,len(lines),25): print(f'{i:04d}: {lines[i][:240]}')
          PY
