name: Inspect CFRN 1995 OCR boundaries

on:
  push:
    paths:
      - '.github/workflows/inspect-cfrn-1995-07-26-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect page headers in irregular 1995 issues
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          root='https://szvkleurojiwqkkztxtr.supabase.co/storage/v1/object/public/media/newspapers/checkered-flag-racing-news'
          for issue in ['1995-07-26','1995-08-02','1995-08-09','1995-08-23']:
              with urllib.request.urlopen(f'{root}/{issue}/ocr.txt',timeout=60) as r:
                  text=r.read().decode('utf-8','replace').replace('\r\n','\n').replace('\r','\n').strip()
              lines=text.splitlines()
              markers=[]
              headers=[]
              for i,line in enumerate(lines):
                  s=line.strip()
                  if re.fullmatch(r'(?i)page\s*\d{1,2}',s): markers.append((i,s))
                  if 'Checkered Flag Racing News' in s: headers.append((i,s))
              print('\nISSUE',issue,'lines',len(lines),'page_markers',len(markers),'headers',len(headers))
              print('PAGE MARKERS',markers[:100])
              print('HEADERS',headers[:100])
          PY
