name: OCR Legacy Extra Program Pages

on:
  push:
    paths:
      - '.github/workflows/ocr-legacy-extra-program-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {key: "hales-1977-cover", slug: "1977-hales-corners-speedway-wi-yearbook", year: 1977, title: "1977 Hales Corners Speedway Program", file: "1977 - MIDWEST SPEEDWAYS PROGRAM.jpg"}
          - {key: "badger-1998-cover", slug: "1998-badger-midget-auto-racing-association-yearbook", year: 1998, title: "1998 Badger Midget Auto Racing Association Yearbook", file: "1998 - BADGER MIDGET YEARBOOK.jpg"}
          - {key: "state-2024-001", slug: "2024-state-park-speedway-wi-yearbook", year: 2024, title: "2024 State Park Speedway Yearbook", file: "STATE PARK SPEEDWAY 2024 YEARBOOK_001.jpg"}
          - {key: "state-2024-022", slug: "2024-state-park-speedway-wi-yearbook", year: 2024, title: "2024 State Park Speedway Yearbook", file: "STATE PARK SPEEDWAY 2024 YEARBOOK_022.jpg"}
          - {key: "state-2024-024", slug: "2024-state-park-speedway-wi-yearbook", year: 2024, title: "2024 State Park Speedway Yearbook", file: "STATE PARK SPEEDWAY 2024 YEARBOOK_024.jpg"}
          - {key: "state-2024-cover", slug: "2024-state-park-speedway-wi-yearbook", year: 2024, title: "2024 State Park Speedway Yearbook", file: "STATE PARK SPEEDWAY 2024 YEARBOOK.jpg"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow
      - name: OCR source image with exact archival filename
        env:
          OCR_DOCUMENT_SLUG: ${{ matrix.slug }}
          OCR_DOCUMENT_TITLE: ${{ matrix.title }}
          OCR_DOCUMENT_YEAR: ${{ matrix.year }}
          OCR_DOCUMENT_TYPE: yearbook
          OCR_SOURCE_FILENAME: ${{ matrix.file }}
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          FLAGS_enable_pir_api: '0'
        run: python scripts/ocr_extra_program_images.py --start 1 --end 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-extra-${{ matrix.key }}
          path: audit-ocr/
          retention-days: 30
          if-no-files-found: warn
  collect:
    needs: ocr
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: legacy-extra-*
          merge-multiple: true
          path: audit-ocr
      - name: Record nonstandard scanned files and their OCR text
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          dest=Path('audit/extra-ocr');dest.mkdir(parents=True,exist_ok=True)
          sources=list(Path('audit-ocr').glob('*/part-*.json'))
          assert len(sources)==6,f'Expected 6 files, found {len(sources)}'
          rows=[]
          for source in sources:
              data=json.loads(source.read_text(encoding='utf-8'))
              assert len(data)==1
              row=data[0]
              rows.append(row)
              print(row['storage_path'],row['status'],len(row['ocr_text']))
              file=dest/f"{row['document_slug']}-{source.stem}.json"
              file.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (dest/'legacy-extra-ocr.json').write_text(json.dumps(rows,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
      - name: Commit preserved OCR metadata
        run: |
          set -euo pipefail
          git config user.name museum-ocr-bot
          git config user.email museum-ocr-bot@users.noreply.github.com
          git add audit/extra-ocr
          git commit -m "OCR nonstandard legacy program image files" || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
