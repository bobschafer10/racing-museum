name: Inspect CFRN OCR newline patterns

on:
  push:
    paths:
      - '.github/workflows/inspect-cfrn-newline-patterns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect newline patterns
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          root='https://szvkleurojiwqkkztxtr.supabase.co/storage/v1/object/public/media/newspapers/checkered-flag-racing-news'
          for issue in ['1992-01-08','1995-04-05']:
              with urllib.request.urlopen(f'{root}/{issue}/ocr.txt',timeout=60) as r:
                  raw=r.read().decode('utf-8','replace').replace('\r\n','\n').replace('\r','\n')
              print('\n===',issue,'===')
              print('form feeds',raw.count('\f'))
              for n in range(2,9):
                  print('exact newline run',n,len(re.findall(r'(?<!\n)\n{%d}(?!\n)'%n,raw)))
              for marker in ['Page 2','Page 3','Page 4','Page 5','Page 7','Page 8','Page 9','Page 10','Page 11','Page11','Page 12']:
                  for m in list(re.finditer(re.escape(marker),raw))[:2]:
                      pos=m.start()
                      print('MARKER',marker,'AT',pos,'CONTEXT',repr(raw[max(0,pos-100):pos+140]))
          PY
