name: Index stored CFRN 1996-1998 OCR

on:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-cfrn-storage-index-1996-1998.yml'

permissions:
  contents: read
  id-token: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [1996, 1997, 1998]
    steps:
      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Parse stored OCR and populate searchable index for ${{ matrix.year }}
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.request, urllib.error

          PROJECT = "szvkleurojiwqkkztxtr"
          PUBLICATION = "checkered-flag-racing-news"
          STORAGE = f"https://{PROJECT}.supabase.co/storage/v1/object/public/media/newspapers/{PUBLICATION}"
          IMPORT = f"https://{PROJECT}.supabase.co/functions/v1/newspaper-ocr-import"
          TOKEN = os.environ["OIDC_TOKEN"]
          YEAR = int(os.environ["YEAR"])

          all_issues = {
              "1996-02-07": 24, "1996-03-06": 20, "1996-04-03": 28,
              "1996-04-10": 16, "1996-04-17": 20, "1996-04-24": 24,
              "1996-05-08": 28, "1996-05-15": 28, "1996-05-22": 32,
              "1996-06-05": 27, "1996-06-19": 32, "1996-07-17": 31,
              "1996-09-04": 32, "1996-10-02": 20, "1996-12-11": 32,
              "1997-10-01": 24, "1997-10-15": 24, "1997-12-10": 32,
              "1998-04-15": 16, "1998-04-22": 24, "1998-04-29": 24,
              "1998-06-24": 36, "1998-07-15": 36, "1998-07-29": 36,
              "1998-09-02": 36, "1998-09-23": 28, "1998-10-07": 20,
              "1998-10-21": 24,
          }
          issues = {issue: count for issue, count in all_issues.items() if issue.startswith(f"{YEAR}-")}
          if not issues:
              raise RuntimeError(f"No configured CFRN issues for {YEAR}")

          old_header = re.compile(r"(?m)^---\s+([^\r\n]+?\.jpe?g)\s+---\s*$", re.I)
          page_header = re.compile(r"(?im)^\s*(?:={2,}\s*)?(?:page|pg\.?)[ #:.-]*(\d{1,3})(?:\s*(?:of|/)\s*\d{1,3})?\s*(?:={2,})?\s*$")

          def request_with_retry(req, timeout, label):
              last = None
              for attempt in range(1, 5):
                  try:
                      return urllib.request.urlopen(req, timeout=timeout)
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode("utf-8", "replace")
                      if e.code not in (408, 409, 429) and e.code < 500:
                          raise RuntimeError(f"{label} failed HTTP {e.code}: {detail}") from e
                      last = RuntimeError(f"{label} failed HTTP {e.code}: {detail}")
                  except (urllib.error.URLError, TimeoutError) as e:
                      last = e
                  if attempt < 4:
                      delay = attempt * 3
                      print(f"{label}: transient failure on attempt {attempt}; retrying in {delay}s", flush=True)
                      time.sleep(delay)
              raise RuntimeError(f"{label} failed after retries: {last}")

          def fetch_text(url, issue):
              req = urllib.request.Request(url, headers={"User-Agent": "UMARM CFRN stored OCR indexer/1.2"})
              with request_with_retry(req, 60, f"{issue} OCR fetch") as r:
                  return r.read().decode("utf-8", "replace")

          def row(page, body, mode):
              return {
                  "page": page,
                  "text": body.strip(),
                  "meta": {
                      "source": "stored-ocr.txt",
                      "import_mode": mode,
                      "line_layout": {"lines": []},
                  },
              }

          def parse_issue(text, expected):
              text = text.replace("\r\n", "\n").replace("\r", "\n")

              matches = list(old_header.finditer(text))
              if matches:
                  pages = []
                  for i, m in enumerate(matches):
                      raw = m.group(1).strip()
                      n = re.search(r"(\d+)(?=\.jpe?g$)", raw, re.I)
                      if not n:
                          break
                      body = text[m.end():(matches[i + 1].start() if i + 1 < len(matches) else len(text))].strip()
                      if not body:
                          break
                      pages.append(row(f"{int(n.group(1)):03d}.jpg", body, "legacy-page-headers"))
                  expected_names = [f"{n:03d}.jpg" for n in range(1, expected + 1)]
                  if [p["page"] for p in pages] == expected_names:
                      return pages, "legacy-page-headers"

              ff = [chunk.strip() for chunk in text.split("\f")]
              ff = [chunk for chunk in ff if chunk]
              if len(ff) == expected:
                  return [row(f"{i:03d}.jpg", body, "form-feed") for i, body in enumerate(ff, 1)], "form-feed"

              matches = list(page_header.finditer(text))
              if matches and len(matches) == expected:
                  pages = []
                  for i, m in enumerate(matches):
                      number = int(m.group(1))
                      body = text[m.end():(matches[i + 1].start() if i + 1 < len(matches) else len(text))].strip()
                      if not body:
                          pages = []
                          break
                      pages.append(row(f"{number:03d}.jpg", body, "page-headings"))
                  expected_names = [f"{n:03d}.jpg" for n in range(1, expected + 1)]
                  if [p["page"] for p in pages] == expected_names:
                      return pages, "page-headings"

              body = text.strip()
              if not body:
                  raise RuntimeError("ocr.txt is empty")
              return [row("001.jpg", body, "issue-level")], "issue-level"

          indexed_rows = 0
          page_level_issues = 0
          issue_level_issues = 0

          for issue, expected in issues.items():
              text = fetch_text(f"{STORAGE}/{issue}/ocr.txt", issue)
              pages, mode = parse_issue(text, expected)
              payload = {
                  "publication": PUBLICATION,
                  "year": YEAR,
                  "issue": issue,
                  "summary": {
                      "engine": "Stored OCR text import",
                      "recognition_model": f"existing ocr.txt ({mode})",
                  },
                  "pages": pages,
                  "candidates": [],
              }
              req = urllib.request.Request(
                  IMPORT,
                  data=json.dumps(payload, separators=(",", ":")).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "UMARM CFRN stored OCR indexer/1.2",
                  },
              )
              with request_with_retry(req, 120, f"{issue} index import") as r:
                  response = json.loads(r.read().decode())
              if not response.get("ok") or int(response.get("updated", 0)) != len(pages):
                  raise RuntimeError(f"{issue} importer verification failed: {response}")
              indexed_rows += len(pages)
              if len(pages) == expected:
                  page_level_issues += 1
              else:
                  issue_level_issues += 1
              print(f"{issue}: mode={mode}, indexed_rows={len(pages)}, scans={expected}", flush=True)

          print(json.dumps({
              "ok": True,
              "year": YEAR,
              "issues": len(issues),
              "scan_pages": sum(issues.values()),
              "indexed_rows": indexed_rows,
              "page_level_issues": page_level_issues,
              "issue_level_issues": issue_level_issues,
          }, indent=2), flush=True)
          PY
