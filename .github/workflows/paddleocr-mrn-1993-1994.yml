name: PaddleOCR MRN 1993-1994

on:
  workflow_dispatch:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-mrn-1993-1994.yml'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      issue_count: ${{ steps.matrix.outputs.issue_count }}
      page_count: ${{ steps.matrix.outputs.page_count }}
    steps:
      - name: Build verified 1993-1994 issue matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          raw = '''
          1993-01-14,12
          1993-02-11,20
          1993-03-11,16
          1993-04-15,24
          1993-04-22,16
          1993-04-29,12
          1993-05-06,12
          1993-05-13,20
          1993-05-20,20
          1993-05-27,20
          1993-06-03,20
          1993-06-10,16
          1993-06-17,20
          1993-06-24,16
          1993-07-01,24
          1993-07-08,20
          1993-07-15,16
          1993-07-22,16
          1993-07-29,20
          1993-08-05,20
          1993-08-12,20
          1993-08-19,16
          1993-08-26,16
          1993-09-02,20
          1993-09-09,16
          1993-09-16,16
          1993-09-23,12
          1993-10-07,16
          1993-11-11,24
          1993-12-09,40
          1994-01-13,12
          1994-02-10,16
          1994-03-10,16
          1994-04-14,20
          1994-04-21,16
          1994-04-28,16
          1994-05-05,12
          1994-05-12,16
          1994-05-19,16
          1994-05-26,20
          1994-06-02,20
          1994-06-09,20
          1994-06-16,20
          1994-06-23,20
          1994-06-30,20
          1994-07-07,20
          1994-07-14,20
          1994-07-21,20
          1994-07-28,20
          1994-08-04,16
          1994-08-11,20
          1994-08-18,16
          1994-08-25,20
          1994-09-01,20
          1994-09-08,20
          1994-09-15,20
          1994-09-22,16
          1994-10-06,16
          1994-11-10,24
          1994-12-08,40
          '''

          rows=[]
          total_pages=0
          for line in raw.splitlines():
              line=line.strip()
              if not line:
                  continue
              issue, spec = line.split(',', 1)
              year=int(issue[:4])
              count=int(spec)
              pages=[f'{n:03d}.jpg' for n in range(1, count + 1)]
              rows.append({
                  'year': year,
                  'issue': issue,
                  'pages_json': json.dumps(pages, separators=(',', ':')),
                  'page_count': count,
              })
              total_pages += count

          if len(rows) != 60 or total_pages != 1124:
              raise SystemExit(f'Control matrix mismatch: {len(rows)} issues / {total_pages} pages')
          controls={1993:556,1994:568}
          for year, expected in controls.items():
              actual=sum(r['page_count'] for r in rows if r['year']==year)
              if actual != expected:
                  raise SystemExit(f'{year} control total mismatch: {actual} != {expected}')

          matrix=json.dumps({'include':rows}, separators=(',', ':'))
          print(f'MRN 1993-1994: {len(rows)} issues / {total_pages} stored numbered pages')
          out=Path(sys.argv[1])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'issue_count={len(rows)}\n')
              f.write(f'page_count={total_pages}\n')
              f.write(f'matrix={matrix}\n')
          PY

  ocr_and_ingest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out OCR runner only
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR ${{ matrix.issue }}
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          NEWSPAPER_PUBLICATION: midwest-racing-news
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGES_JSON: ${{ matrix.pages_json }}
          MRN_OUTPUT_ROOT: audit/paddleocr-mrn-1993-1994/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ingest searchable OCR and standings candidates
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          ISSUE: ${{ matrix.issue }}
          EXPECTED_PAGES: ${{ matrix.page_count }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ISSUE_DIR: audit/paddleocr-mrn-1993-1994/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python - "$ISSUE_DIR" "$YEAR" > /tmp/ocr-payload.json <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          year=int(sys.argv[2])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')) if (root/'candidates.json').exists() else []
          pages=[]
          for meta in summary.get('pages',[]):
              page=str(meta['page'])
              stem=Path(page).stem
              text=(root/'text'/f'{stem}-columns.txt').read_text(encoding='utf-8')
              pages.append({'page':page,'text':text,'meta':meta})
          print(json.dumps({
              'publication':'midwest-racing-news',
              'year':year,
              'issue':summary['issue_date'],
              'summary':summary,
              'pages':pages,
              'candidates':candidates,
          }, separators=(',',':')))
          PY
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ocr-payload.json \
            'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-import')"
          echo "$ISSUE: $response"
          updated="$(echo "$response" | jq -r '.updated // 0')"
          test "$updated" -eq "$EXPECTED_PAGES"

      - name: Upload OCR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-${{ matrix.issue }}
          path: audit/paddleocr-mrn-1993-1994/${{ matrix.issue }}
          if-no-files-found: warn
          retention-days: 14
