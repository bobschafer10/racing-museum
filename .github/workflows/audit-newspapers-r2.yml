name: Audit newspaper R2 object inventory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_newspaper_r2_inventory.py'
      - '.github/workflows/audit-newspapers-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - name: Compare every source issue object with R2 inventory (read only)
        env:
          SUPABASE_URL: ${{ secrets.MIGRATION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MIGRATION_SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.MIGRATION_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.MIGRATION_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.MIGRATION_R2_SECRET_ACCESS_KEY }}
        run: python scripts/audit_newspaper_r2_inventory.py
      - name: Preserve reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-r2-full-reconciliation
          path: migration-reports/full-r2-reconciliation.json
          if-no-files-found: warn
          retention-days: 90
