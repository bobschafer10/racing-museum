name: PaddleOCR MRN 2001-2002

on:
  workflow_dispatch:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - 'ocr-jobs/mrn-2001-2002-start.txt'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      issue_count: ${{ steps.matrix.outputs.issue_count }}
      page_count: ${{ steps.matrix.outputs.page_count }}
    steps:
      - name: Build verified 2001-2002 issue matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          raw = '''
          2001-01-11,16
          2001-02-08,16
          2001-03-08,20
          2001-04-05,20
          2001-04-12,16
          2001-04-19,20
          2001-04-26,20
          2001-05-03,20
          2001-05-10,24
          2001-05-17,20
          2001-05-24,24
          2001-05-31,20
          2001-06-07,20
          2001-06-14,20
          2001-06-21,20
          2001-06-28,24
          2001-07-05,20
          2001-07-12,24
          2001-07-19,24
          2001-07-26,20
          2001-08-02,24
          2001-08-09,20
          2001-08-16,24
          2001-08-23,16
          2001-08-30,16
          2001-09-06,20
          2001-09-13,16
          2001-10-04,32
          2001-11-01,24
          2001-12-06,48
          2002-01-10,16
          2002-02-07,20
          2002-03-07,24
          2002-04-04,20
          2002-04-11,16
          2002-04-18,16
          2002-04-25,20
          2002-05-02,16
          2002-05-09,20
          2002-05-16,20
          2002-05-23,24
          2002-05-30,20
          2002-06-06,24
          2002-06-13,24
          2002-06-20,20
          2002-06-27,24
          2002-07-04,24
          2002-07-11,24
          2002-07-18,20
          2002-07-25,24
          2002-08-01,24
          2002-08-08,20
          2002-08-15,20
          2002-08-22,24
          2002-08-29,24
          2002-09-05,24
          2002-09-12,24
          2002-10-10,32
          2002-11-07,24
          2002-12-12,44
          '''

          rows=[]
          total_pages=0
          for line in raw.splitlines():
              line=line.strip()
              if not line:
                  continue
              issue, spec = line.split(',', 1)
              year=int(issue[:4])
              count=int(spec)
              pages=[f'{n:03d}.jpg' for n in range(1, count + 1)]
              rows.append({
                  'year': year,
                  'issue': issue,
                  'pages_json': json.dumps(pages, separators=(',', ':')),
                  'page_count': count,
              })
              total_pages += count

          if len(rows) != 60 or total_pages != 1324:
              raise SystemExit(f'Control matrix mismatch: {len(rows)} issues / {total_pages} pages')

          controls={2001:(30,648),2002:(30,676)}
          for year, (expected_issues, expected_pages) in controls.items():
              year_rows=[r for r in rows if r['year']==year]
              actual_pages=sum(r['page_count'] for r in year_rows)
              if len(year_rows) != expected_issues or actual_pages != expected_pages:
                  raise SystemExit(
                      f'{year} control mismatch: {len(year_rows)} issues / {actual_pages} pages '
                      f'!= {expected_issues} / {expected_pages}'
                  )

          matrix=json.dumps({'include':rows}, separators=(',', ':'))
          print(f'MRN 2001-2002: {len(rows)} issues / {total_pages} stored numbered pages')
          out=Path(sys.argv[1])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'issue_count={len(rows)}\n')
              f.write(f'page_count={total_pages}\n')
              f.write(f'matrix={matrix}\n')
          PY

  ocr_and_ingest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out OCR runner only
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR ${{ matrix.issue }}
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          NEWSPAPER_PUBLICATION: midwest-racing-news
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGES_JSON: ${{ matrix.pages_json }}
          MRN_OUTPUT_ROOT: audit/paddleocr-mrn-2001-2002/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ingest searchable OCR and standings candidates
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          ISSUE: ${{ matrix.issue }}
          EXPECTED_PAGES: ${{ matrix.page_count }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ISSUE_DIR: audit/paddleocr-mrn-2001-2002/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python - "$ISSUE_DIR" "$YEAR" > /tmp/ocr-payload.json <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          year=int(sys.argv[2])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')) if (root/'candidates.json').exists() else []
          pages=[]
          for meta in summary.get('pages',[]):
              page=str(meta['page'])
              stem=Path(page).stem
              text=(root/'text'/f'{stem}-columns.txt').read_text(encoding='utf-8')
              pages.append({'page':page,'text':text,'meta':meta})
          print(json.dumps({
              'publication':'midwest-racing-news',
              'year':year,
              'issue':summary['issue_date'],
              'summary':summary,
              'pages':pages,
              'candidates':candidates,
          }, separators=(',',':')))
          PY
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ocr-payload.json \
            'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-import')"
          echo "$ISSUE: $response"
          updated="$(echo "$response" | jq -r '.updated // 0')"
          test "$updated" -eq "$EXPECTED_PAGES"

      - name: Upload OCR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-${{ matrix.issue }}
          path: audit/paddleocr-mrn-2001-2002/${{ matrix.issue }}
          if-no-files-found: warn
          retention-days: 14
