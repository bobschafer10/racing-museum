name: PaddleOCR MRN 1998-2000

on:
  workflow_dispatch:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-mrn-1998-2000.yml'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      issue_count: ${{ steps.matrix.outputs.issue_count }}
      page_count: ${{ steps.matrix.outputs.page_count }}
    steps:
      - name: Build verified 1998-2000 issue matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          raw = '''
          1998-01-15,20
          1998-02-05,16
          1998-03-12,20
          1998-04-09,20
          1998-04-16,16
          1998-04-23,16
          1998-04-30,16
          1998-05-07,16
          1998-05-14,20
          1998-05-21,24
          1998-05-28,24
          1998-06-04,20
          1998-06-11,24
          1998-06-18,20
          1998-06-25,20
          1998-07-02,24
          1998-07-09,20
          1998-07-16,20
          1998-07-23,24
          1998-07-30,20
          1998-08-06,20
          1998-08-13,20
          1998-08-20,24
          1998-08-27,20
          1998-09-03,20
          1998-09-10,20
          1998-09-17,16
          1998-10-01,20
          1998-11-05,24
          1998-12-10,52
          1999-01-14,16
          1999-02-11,20
          1999-03-11,20
          1999-04-08,20
          1999-04-15,16
          1999-04-22,16
          1999-04-29,20
          1999-05-06,20
          1999-05-13,20
          1999-05-20,20
          1999-05-27,24
          1999-06-03,20
          1999-06-10,24
          1999-06-17,20
          1999-06-24,24
          1999-07-01,24
          1999-07-08,24
          1999-07-15,24
          1999-07-22,20
          1999-07-29,20
          1999-08-05,24
          1999-08-12,20
          1999-08-19,20
          1999-08-26,20
          1999-09-02,20
          1999-09-09,20
          1999-09-16,20
          1999-10-07,24
          1999-11-11,24
          1999-12-09,52
          2000-01-13,16
          2000-02-10,24
          2000-03-09,24
          2000-04-06,24
          2000-04-13,16
          2000-04-20,16
          2000-04-27,16
          2000-05-04,20
          2000-05-11,20
          2000-05-18,20
          2000-05-25,20
          2000-06-01,20
          2000-06-08,20
          2000-06-15,20
          2000-06-22,20
          2000-06-29,20
          2000-07-06,16
          2000-07-13,20
          2000-07-20,20
          2000-07-27,20
          2000-08-03,20
          2000-08-10,20
          2000-08-17,20
          2000-08-24,20
          2000-08-31,24
          2000-09-07,20
          2000-09-14,20
          2000-10-05,28
          2000-11-02,20
          2000-12-07,52
          '''

          rows=[]
          total_pages=0
          for line in raw.splitlines():
              line=line.strip()
              if not line:
                  continue
              issue, spec = line.split(',', 1)
              year=int(issue[:4])
              count=int(spec)
              pages=[f'{n:03d}.jpg' for n in range(1, count + 1)]
              rows.append({
                  'year': year,
                  'issue': issue,
                  'pages_json': json.dumps(pages, separators=(',', ':')),
                  'page_count': count,
              })
              total_pages += count

          if len(rows) != 90 or total_pages != 1928:
              raise SystemExit(f'Control matrix mismatch: {len(rows)} issues / {total_pages} pages')

          controls={1998:(30,636),1999:(30,656),2000:(30,636)}
          for year, (expected_issues, expected_pages) in controls.items():
              year_rows=[r for r in rows if r['year']==year]
              actual_pages=sum(r['page_count'] for r in year_rows)
              if len(year_rows) != expected_issues or actual_pages != expected_pages:
                  raise SystemExit(
                      f'{year} control mismatch: {len(year_rows)} issues / {actual_pages} pages '
                      f'!= {expected_issues} / {expected_pages}'
                  )

          matrix=json.dumps({'include':rows}, separators=(',', ':'))
          print(f'MRN 1998-2000: {len(rows)} issues / {total_pages} stored numbered pages')
          out=Path(sys.argv[1])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'issue_count={len(rows)}\n')
              f.write(f'page_count={total_pages}\n')
              f.write(f'matrix={matrix}\n')
          PY

  ocr_and_ingest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out OCR runner only
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR ${{ matrix.issue }}
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          NEWSPAPER_PUBLICATION: midwest-racing-news
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGES_JSON: ${{ matrix.pages_json }}
          MRN_OUTPUT_ROOT: audit/paddleocr-mrn-1998-2000/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ingest searchable OCR and standings candidates
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          ISSUE: ${{ matrix.issue }}
          EXPECTED_PAGES: ${{ matrix.page_count }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ISSUE_DIR: audit/paddleocr-mrn-1998-2000/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python - "$ISSUE_DIR" "$YEAR" > /tmp/ocr-payload.json <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          year=int(sys.argv[2])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')) if (root/'candidates.json').exists() else []
          pages=[]
          for meta in summary.get('pages',[]):
              page=str(meta['page'])
              stem=Path(page).stem
              text=(root/'text'/f'{stem}-columns.txt').read_text(encoding='utf-8')
              pages.append({'page':page,'text':text,'meta':meta})
          print(json.dumps({
              'publication':'midwest-racing-news',
              'year':year,
              'issue':summary['issue_date'],
              'summary':summary,
              'pages':pages,
              'candidates':candidates,
          }, separators=(',',':')))
          PY
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ocr-payload.json \
            'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-import')"
          echo "$ISSUE: $response"
          updated="$(echo "$response" | jq -r '.updated // 0')"
          test "$updated" -eq "$EXPECTED_PAGES"

      - name: Upload OCR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-${{ matrix.issue }}
          path: audit/paddleocr-mrn-1998-2000/${{ matrix.issue }}
          if-no-files-found: warn
          retention-days: 14
