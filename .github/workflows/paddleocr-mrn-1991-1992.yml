name: PaddleOCR MRN 1991-1992

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      issue_count: ${{ steps.matrix.outputs.issue_count }}
      page_count: ${{ steps.matrix.outputs.page_count }}
    steps:
      - name: Build verified 1991-1992 issue matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          raw = '''
          1991-01-10,12
          1991-02-07,16
          1991-03-07,20
          1991-04-18,20
          1991-04-25,12
          1991-05-02,16
          1991-05-09,16
          1991-05-16,20
          1991-05-23,20
          1991-05-30,001.jpg;002.jpg;003.jpg;004.jpg;005.jpg;006.jpg;007.jpg;008.jpg;009.jpg;010.jpg;011.jpg;012.jpg;013.jpg;014.jpg;015.jpg;020.jpg
          1991-06-06,16
          1991-06-13,20
          1991-06-20,24
          1991-06-27,20
          1991-07-04,20
          1991-07-11,20
          1991-07-18,20
          1991-07-25,20
          1991-08-01,20
          1991-08-08,20
          1991-08-15,20
          1991-08-22,24
          1991-08-29,20
          1991-09-05,20
          1991-09-12,20
          1991-09-19,16
          1991-09-26,16
          1991-10-10,16
          1991-11-07,28
          1991-12-12,40
          1992-01-09,12
          1992-02-06,16
          1992-03-05,20
          1992-04-16,24
          1992-04-23,16
          1992-04-30,12
          1992-05-07,16
          1992-05-14,16
          1992-05-21,24
          1992-05-28,20
          1992-06-04,20
          1992-06-11,20
          1992-06-18,24
          1992-06-25,24
          1992-07-02,24
          1992-07-09,20
          1992-07-16,20
          1992-07-23,20
          1992-07-30,16
          1992-08-06,20
          1992-08-13,16
          1992-08-20,20
          1992-08-27,20
          1992-09-03,20
          1992-09-10,20
          1992-09-17,20
          1992-09-24,16
          1992-10-08,16
          1992-11-12,28
          1992-12-10,40
          '''

          rows=[]
          total_pages=0
          for line in raw.splitlines():
              line=line.strip()
              if not line:
                  continue
              issue, spec = line.split(',', 1)
              year=int(issue[:4])
              if spec.isdigit():
                  count=int(spec)
                  pages=[f'{n:03d}.jpg' for n in range(1, count + 1)]
              else:
                  pages=[p.strip() for p in spec.split(';') if p.strip()]
                  count=len(pages)
              rows.append({
                  'year': year,
                  'issue': issue,
                  'pages_json': json.dumps(pages, separators=(',', ':')),
                  'page_count': count,
              })
              total_pages += count

          if len(rows) != 60 or total_pages != 1188:
              raise SystemExit(f'Control matrix mismatch: {len(rows)} issues / {total_pages} pages')
          controls={1991:588,1992:600}
          for year, expected in controls.items():
              actual=sum(r['page_count'] for r in rows if r['year']==year)
              if actual != expected:
                  raise SystemExit(f'{year} control total mismatch: {actual} != {expected}')

          special=next(r for r in rows if r['issue']=='1991-05-30')
          expected_special=[f'{n:03d}.jpg' for n in range(1,16)] + ['020.jpg']
          if json.loads(special['pages_json']) != expected_special:
              raise SystemExit('1991-05-30 special page list mismatch')

          matrix=json.dumps({'include':rows}, separators=(',', ':'))
          print(f'MRN 1991-1992: {len(rows)} issues / {total_pages} currently stored numbered pages')
          print('NOTE: 1991-05-30 currently has 001-015 and 020 only; 016-019 remain missing from Storage.')
          out=Path(sys.argv[1])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'issue_count={len(rows)}\n')
              f.write(f'page_count={total_pages}\n')
              f.write(f'matrix={matrix}\n')
          PY

  ocr_and_ingest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out OCR runner only
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR ${{ matrix.issue }}
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          NEWSPAPER_PUBLICATION: midwest-racing-news
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGES_JSON: ${{ matrix.pages_json }}
          MRN_OUTPUT_ROOT: audit/paddleocr-mrn-1991-1992/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ingest searchable OCR and standings candidates
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          ISSUE: ${{ matrix.issue }}
          EXPECTED_PAGES: ${{ matrix.page_count }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ISSUE_DIR: audit/paddleocr-mrn-1991-1992/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python - "$ISSUE_DIR" "$YEAR" > /tmp/ocr-payload.json <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          year=int(sys.argv[2])
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')) if (root/'candidates.json').exists() else []
          pages=[]
          for meta in summary.get('pages',[]):
              page=str(meta['page'])
              stem=Path(page).stem
              text=(root/'text'/f'{stem}-columns.txt').read_text(encoding='utf-8')
              pages.append({'page':page,'text':text,'meta':meta})
          print(json.dumps({
              'publication':'midwest-racing-news',
              'year':year,
              'issue':summary['issue_date'],
              'summary':summary,
              'pages':pages,
              'candidates':candidates,
          }, separators=(',',':')))
          PY
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ocr-payload.json \
            'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-import')"
          echo "$ISSUE: $response"
          updated="$(echo "$response" | jq -r '.updated // 0')"
          test "$updated" -eq "$EXPECTED_PAGES"

      - name: Upload OCR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-${{ matrix.issue }}
          path: audit/paddleocr-mrn-1991-1992/${{ matrix.issue }}
          if-no-files-found: warn
          retention-days: 14
