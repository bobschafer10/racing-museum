# temporary recovery run 4
name: Temporary Wayback Enduro Audit

on:
  push:
    paths:
      - '.github/workflows/wayback-enduro-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch final standings pages directly
        shell: bash
        run: |
          set -u
          mkdir -p audit/pages
          python - <<'PY'
          import json, urllib.request
          targets={
            '1996':('19980704224349','http://www.racingonline.com/enduro/st1996.html'),
            '1997':('19980120041618','http://www.racingonline.com/enduro/st1997.html'),
            '1998':('19991117020218','http://www.racingonline.com/enduro/st1998.html'),
            '1999':('20001117110000','http://www.racingonline.com/enduro/st1999.html'),
          }
          meta={}
          for year,(ts,target) in targets.items():
            snap=f'https://web.archive.org/web/{ts}id_/{target}'
            try:
              req=urllib.request.Request(snap,headers={'User-Agent':'UMARM historical research/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                body=r.read(); final_url=r.geturl(); status=r.status
              open(f'audit/pages/{year}.html','wb').write(body)
              meta[year]={'requested':snap,'resolved':final_url,'status':status,'bytes':len(body)}
              print(year,status,len(body),final_url)
            except Exception as e:
              meta[year]={'requested':snap,'error':repr(e)}
              print('ERROR',year,repr(e))
          open('audit/meta.json','w').write(json.dumps(meta,indent=2))
          PY
      - name: Upload recovered archive files
        uses: actions/upload-artifact@v4
        with:
          name: wayback-enduro-finals-direct
          path: audit
          if-no-files-found: error
          retention-days: 1
