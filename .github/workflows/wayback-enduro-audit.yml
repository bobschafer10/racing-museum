# temporary recovery run 3
name: Temporary Wayback Enduro Audit

on:
  push:
    paths:
      - '.github/workflows/wayback-enduro-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch linked final standings pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/pages
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          base='http://www.racingonline.com/enduro/'
          allrows={}
          for year in range(1996,2000):
            target=f'{base}st{year}.html'
            params={'url':target,'from':str(year),'to':'2001','output':'json','filter':'statuscode:200','fl':'timestamp,original,statuscode,mimetype,digest','collapse':'digest'}
            url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'User-Agent':'UMARM historical research/1.0'})
            with urllib.request.urlopen(req,timeout=90) as r: raw=r.read()
            data=json.loads(raw)
            rows=[]
            if data:
              header=data[0]
              for row in data[1:]: rows.append(dict(zip(header,row)))
            allrows[str(year)]=rows
            print(year,'captures',len(rows))
            # Fetch the latest unique surviving capture, plus all if only a few.
            for row in rows:
              ts=row['timestamp']
              snap=f'https://web.archive.org/web/{ts}id_/{target}'
              try:
                req=urllib.request.Request(snap,headers={'User-Agent':'UMARM historical research/1.0'})
                with urllib.request.urlopen(req,timeout=90) as r: body=r.read()
                open(f'audit/pages/{year}_{ts}.html','wb').write(body)
                print(year,ts,len(body))
              except Exception as e: print('ERROR',year,ts,repr(e))
              time.sleep(.2)
          open('audit/captures.json','w').write(json.dumps(allrows,indent=2))
          PY
      - name: Upload recovered archive files
        uses: actions/upload-artifact@v4
        with:
          name: wayback-enduro-finals
          path: audit
          if-no-files-found: error
          retention-days: 1
