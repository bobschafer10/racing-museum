name: Refresh New Newspapers and OCR 1979-1980

on:
  workflow_dispatch:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-mrn-new-1979-1980.yml'

permissions:
  contents: write
  id-token: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    outputs:
      manifest_commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check out OCR tools branch
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          path: tools

      - name: Check out website main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install newspaper manager dependencies
        working-directory: tools/museum-newspaper-manager
        run: npm install --no-audit --no-fund

      - name: Rebuild newspaper manifest from Supabase Storage
        working-directory: tools/museum-newspaper-manager
        run: node rebuild-manifest-from-storage.js

      - name: Copy rebuilt manifest into main checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/public/data site/museum-newspaper-manager/public/data
          cp tools/public/data/newspapers-manifest.json site/public/data/newspapers-manifest.json
          cp tools/museum-newspaper-manager/public/data/newspapers-manifest.json site/museum-newspaper-manager/public/data/newspapers-manifest.json

      - name: Verify new years are in rebuilt manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows=json.loads(Path('site/public/data/newspapers-manifest.json').read_text(encoding='utf-8'))
          wanted={
              ('midwest-racing-news',1979),
              ('midwest-racing-news',1980),
              ('checkered-flag-racing-news',1979),
          }
          counts=Counter((r.get('publicationSlug'),int(r.get('year') or 0)) for r in rows)
          for key in sorted(wanted):
              print(key, counts[key])
              if counts[key] < 1:
                  raise SystemExit(f'Missing required newspaper batch: {key}')
          PY

      - name: Commit refreshed manifest to main
        id: commit
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UMARM OCR Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/newspapers-manifest.json museum-newspaper-manager/public/data/newspapers-manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
          else
            git commit -m 'Refresh newspaper manifest for MRN 1979-1980 and CFRN 1979'
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload manifest for OCR preparation
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-manifest-1979-1980
          path: site/public/data/newspapers-manifest.json
          retention-days: 7

  prepare:
    needs: refresh-manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      issue_count: ${{ steps.matrix.outputs.issue_count }}
      page_count: ${{ steps.matrix.outputs.page_count }}
    steps:
      - name: Download refreshed manifest
        uses: actions/download-artifact@v4
        with:
          name: newspaper-manifest-1979-1980
          path: manifest

      - name: Build OCR issue matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          from collections import Counter
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          output=Path(sys.argv[1])
          rows=json.loads(Path('manifest/newspapers-manifest.json').read_text(encoding='utf-8'))
          targets={
              ('midwest-racing-news',1979): 'mrn',
              ('midwest-racing-news',1980): 'mrn',
              ('checkered-flag-racing-news',1979): 'cfrn',
          }
          image_re=re.compile(r'.+\.(?:jpg|jpeg|png|webp)$',re.I)
          matrix=[]
          total_pages=0
          counts=Counter()

          for issue in rows:
              publication=str(issue.get('publicationSlug') or '')
              year=int(issue.get('year') or 0)
              key=(publication,year)
              if key not in targets:
                  continue
              issue_date=str(issue.get('issueDate') or issue.get('slug') or '')
              if not issue_date.startswith(f'{year}-'):
                  continue

              pages=[]
              seen=set()
              # The manifest pages array contains the canonical source scans and
              # excludes generated front/back-cover and thumbnail convenience files.
              for url in issue.get('pages') or []:
                  if not isinstance(url,str) or not url:
                      continue
                  filename=unquote(urlparse(url).path.split('/')[-1])
                  low=filename.lower()
                  if low in {'front-cover.jpg','back-cover.jpg','thumbnail.jpg'}:
                      continue
                  if not image_re.fullmatch(filename):
                      continue
                  if '/' in filename or '\\' in filename or filename in {'.','..'}:
                      raise SystemExit(f'Unsafe filename for {issue_date}: {filename!r}')
                  if filename in seen:
                      continue
                  seen.add(filename)
                  pages.append(filename)

              if not pages:
                  raise SystemExit(f'No canonical source scans found for {publication} {issue_date}')

              matrix.append({
                  'publication': publication,
                  'pub_short': targets[key],
                  'year': year,
                  'issue': issue_date,
                  'pages_json': json.dumps(pages,separators=(',',':')),
                  'page_count': len(pages),
              })
              counts[key] += 1
              total_pages += len(pages)

          matrix.sort(key=lambda r:(r['publication'],r['year'],r['issue']))
          for key in targets:
              if counts[key] < 1:
                  raise SystemExit(f'No issues found for target {key}')
              print(f'{key[0]} {key[1]}: {counts[key]} issues')
          print(f'Total: {len(matrix)} issues / {total_pages} source scans')

          payload=json.dumps({'include':matrix},separators=(',',':'))
          with output.open('a',encoding='utf-8') as f:
              f.write(f'matrix={payload}\n')
              f.write(f'issue_count={len(matrix)}\n')
              f.write(f'page_count={total_pages}\n')
          PY

  ocr:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out OCR runner
        uses: actions/checkout@v4
        with:
          ref: paddleocr-mrn-pilot
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR ${{ matrix.publication }} ${{ matrix.issue }}
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          NEWSPAPER_PUBLICATION: ${{ matrix.publication }}
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGES_JSON: ${{ matrix.pages_json }}
          MRN_OUTPUT_ROOT: audit/newspapers-1979-1980/${{ matrix.pub_short }}/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Upload OCR issue artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-1979-1980-${{ matrix.pub_short }}-${{ matrix.issue }}
          path: audit/newspapers-1979-1980/${{ matrix.pub_short }}/${{ matrix.issue }}
          if-no-files-found: warn
          retention-days: 14

  ingest:
    needs: [prepare, ocr]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download OCR issue artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: news-1979-1980-*
          path: collected
          merge-multiple: false

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=umarm-newspaper-ocr-import" | jq -r '.value')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ingest OCR pages and standings candidates
        shell: bash
        env:
          EXPECTED_PAGES: ${{ needs.prepare.outputs.page_count }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          total=0
          candidate_total=0
          while IFS= read -r summary; do
            issue_dir="$(dirname "$summary")"
            issue="$(jq -r '.issue_date' "$summary")"
            publication="$(jq -r '.publication' "$summary")"
            year="${issue:0:4}"
            python - "$issue_dir" "$year" "$publication" > /tmp/ocr-payload.json <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          year=int(sys.argv[2])
          publication=sys.argv[3]
          summary=json.loads((root/'summary.json').read_text(encoding='utf-8'))
          candidates=json.loads((root/'candidates.json').read_text(encoding='utf-8')) if (root/'candidates.json').exists() else []
          pages=[]
          for meta in summary.get('pages',[]):
              page=str(meta['page'])
              stem=Path(page).stem
              text=(root/'text'/f'{stem}-columns.txt').read_text(encoding='utf-8')
              pages.append({'page':page,'text':text,'meta':meta})
          payload={
              'publication':publication,
              'year':year,
              'issue':summary['issue_date'],
              'summary':summary,
              'pages':pages,
              'candidates':candidates,
          }
          print(json.dumps(payload,separators=(',',':')))
          PY
            response="$(curl -fsSL -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/ocr-payload.json \
              'https://szvkleurojiwqkkztxtr.supabase.co/functions/v1/newspaper-ocr-import')"
            echo "$publication $issue: $response"
            updated="$(echo "$response" | jq -r '.updated // 0')"
            saved_candidates="$(echo "$response" | jq -r '.candidates_saved // 0')"
            total=$((total + updated))
            candidate_total=$((candidate_total + saved_candidates))
          done < <(find collected -name summary.json -print | sort)
          echo "Imported searchable pages: $total / $EXPECTED_PAGES"
          echo "Saved automated standings candidates: $candidate_total"
          test "$total" -eq "$EXPECTED_PAGES"

  verify:
    needs: ingest
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Report completion
        run: |
          echo 'MRN 1979, MRN 1980, and CFRN 1979 OCR completed and ingested.'
