name: Add CFRN 1980s storage bridge

on:
  push:
    paths:
      - '.github/workflows/add-cfrn-1980s-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add CFRN 1980-1988 stored issue bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/newspapers.ts')
          s = p.read_text(encoding='utf-8')

          const_marker = 'const CFRN_1992_PAGE_COUNTS: Record<string, number> = {'
          const_block = '''const CFRN_1980S_PAGE_COUNTS: Record<string, number> = {
            "1980-01-09": 12,
            "1980-02-06": 20,
            "1981-01-14": 12,
            "1981-03-04": 32,
            "1981-04-08": 16,
            "1981-11-11": 17,
            "1981-12-16": 40,
            "1982-01-13": 12,
            "1983-11-09": 20,
            "1984-01-11": 12,
            "1984-02-08": 16,
            "1984-02-29": 28,
            "1984-03-21": 16,
            "1984-04-04": 16,
            "1984-04-11": 12,
            "1984-04-18": 12,
            "1984-04-25": 16,
            "1984-05-02": 16,
            "1984-12-12": 21,
            "1985-01-09": 16,
            "1985-02-27": 20,
            "1985-03-13": 16,
            "1985-04-03": 20,
            "1985-04-10": 12,
            "1986-01-15": 16,
            "1986-03-05": 16,
            "1986-03-19": 20,
            "1986-04-02": 12,
            "1986-04-09": 12,
            "1986-12-10": 32,
            "1987-09-16": 20,
            "1987-09-23": 16,
            "1987-09-30": 16,
            "1987-10-07": 16,
            "1987-10-21": 16,
            "1987-11-11": 16,
            "1988-10-19": 11,
          }

          '''
          if 'CFRN_1980S_PAGE_COUNTS' not in s:
              if const_marker not in s:
                  raise SystemExit('CFRN 1992 constant marker not found')
              s = s.replace(const_marker, const_block + const_marker, 1)

          func_marker = 'function getCfrn1992StorageIssues(): NewspaperIssue[] {'
          func_block = '''function getCfrn1980sStorageIssues(): NewspaperIssue[] {
            return Object.entries(CFRN_1980S_PAGE_COUNTS).map(([issueDate, pageCount]) => {
              const isIncomplete1988 = issueDate === "1988-10-19"
              return {
                slug: issueDate,
                title: titleFromIsoDate(issueDate),
                publication: "Checkered Flag Racing News",
                publicationSlug: "checkered-flag-racing-news",
                year: Number(issueDate.slice(0, 4)),
                issueDate,
                description: isIncomplete1988
                  ? "Partial supplied issue: 11 scans are preserved; OCR processing is being completed from the available pages."
                  : null,
                coverImage: isIncomplete1988
                  ? `${CFRN_STORAGE_ROOT}/${issueDate}/001.jpg`
                  : `${CFRN_STORAGE_ROOT}/${issueDate}/front-cover.jpg`,
                backCoverImage: isIncomplete1988
                  ? `${CFRN_STORAGE_ROOT}/${issueDate}/${String(pageCount).padStart(3, "0")}.jpg`
                  : `${CFRN_STORAGE_ROOT}/${issueDate}/back-cover.jpg`,
                thumbnail: isIncomplete1988
                  ? `${CFRN_STORAGE_ROOT}/${issueDate}/001.jpg`
                  : `${CFRN_STORAGE_ROOT}/${issueDate}/thumbnail.jpg`,
                pages: cfrn1976Pages(issueDate, 1, pageCount),
                featured: false,
              }
            })
          }

          '''
          if 'function getCfrn1980sStorageIssues' not in s:
              if func_marker not in s:
                  raise SystemExit('CFRN 1992 function marker not found')
              s = s.replace(func_marker, func_block + func_marker, 1)

          merge_marker = '      ...getCfrn1976StorageIssues(),\n'
          if '...getCfrn1980sStorageIssues(),' not in s:
              if merge_marker not in s:
                  raise SystemExit('CFRN 1976 merge marker not found')
              s = s.replace(
                  merge_marker,
                  merge_marker + '      ...getCfrn1980sStorageIssues(),\n'
              )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify bridge references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path('lib/newspapers.ts').read_text(encoding='utf-8')
          assert 'CFRN_1980S_PAGE_COUNTS' in s
          assert 'function getCfrn1980sStorageIssues' in s
          count = s.count('...getCfrn1980sStorageIssues(),')
          if count < 2:
              raise SystemExit(f'Expected bridge in both archive lists; found {count}')
          print(f'Bridge references verified: {count}')
          PY

      - name: Commit bridge
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/newspapers.ts; then
            echo 'Bridge already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/newspapers.ts
          git commit -m 'Publish stored CFRN 1980-1988 issues'
          git push origin HEAD:main
