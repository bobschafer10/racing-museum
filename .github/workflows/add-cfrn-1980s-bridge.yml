name: Add CFRN 1980s storage bridge

on:
  push:
    paths:
      - '.github/workflows/add-cfrn-1980s-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish complete CFRN 1988 storage bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/newspapers.ts')
          s = p.read_text(encoding='utf-8')

          block = '''const CFRN_1980S_PAGE_COUNTS: Record<string, number> = {
            "1980-01-09": 12,
            "1980-02-06": 20,
            "1981-01-14": 12,
            "1981-03-04": 32,
            "1981-04-08": 16,
            "1981-11-11": 17,
            "1981-12-16": 40,
            "1982-01-13": 12,
            "1983-11-09": 20,
            "1984-01-11": 12,
            "1984-02-08": 16,
            "1984-02-29": 28,
            "1984-03-21": 16,
            "1984-04-04": 16,
            "1984-04-11": 12,
            "1984-04-18": 12,
            "1984-04-25": 16,
            "1984-05-02": 16,
            "1984-12-12": 21,
            "1985-01-09": 16,
            "1985-02-27": 20,
            "1985-03-13": 16,
            "1985-04-03": 20,
            "1985-04-10": 12,
            "1986-01-15": 16,
            "1986-03-05": 16,
            "1986-03-19": 20,
            "1986-04-02": 12,
            "1986-04-09": 12,
            "1986-12-10": 32,
            "1987-09-16": 20,
            "1987-09-23": 16,
            "1987-09-30": 16,
            "1987-10-07": 16,
            "1987-10-21": 16,
            "1987-11-11": 16,
            "1988-03-23": 24,
            "1988-04-06": 20,
            "1988-04-13": 16,
            "1988-04-20": 20,
            "1988-04-27": 20,
            "1988-05-04": 20,
            "1988-05-11": 20,
            "1988-05-18": 20,
            "1988-05-25": 20,
            "1988-06-01": 24,
            "1988-06-08": 24,
            "1988-06-15": 28,
            "1988-06-22": 24,
            "1988-06-29": 24,
            "1988-07-06": 28,
            "1988-07-13": 24,
            "1988-07-20": 24,
            "1988-07-27": 24,
            "1988-08-03": 24,
            "1988-08-10": 24,
            "1988-08-17": 24,
            "1988-08-24": 28,
            "1988-08-31": 24,
            "1988-09-07": 24,
            "1988-09-14": 8,
            "1988-09-28": 1,
            "1988-10-19": 16,
          }'''
          s, n = re.subn(r'const CFRN_1980S_PAGE_COUNTS: Record<string, number> = \{.*?\n\}', block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace CFRN_1980S_PAGE_COUNTS')

          func = '''function getCfrn1980sStorageIssues(): NewspaperIssue[] {
            return Object.entries(CFRN_1980S_PAGE_COUNTS).map(([issueDate, pageCount]) => {
              const isPagesOnly1988 = ["1988-07-20", "1988-09-14", "1988-09-28"].includes(issueDate)
              const isPartial1988 = ["1988-09-14", "1988-09-28", "1988-10-19"].includes(issueDate)
              return {
                slug: issueDate,
                title: titleFromIsoDate(issueDate),
                publication: "Checkered Flag Racing News",
                publicationSlug: "checkered-flag-racing-news",
                year: Number(issueDate.slice(0, 4)),
                issueDate,
                description: isPartial1988
                  ? "Partial supplied issue: all available scans are preserved and OCR searchable."
                  : null,
                coverImage: isPagesOnly1988
                  ? `${CFRN_STORAGE_ROOT}/${issueDate}/001.jpg`
                  : `${CFRN_STORAGE_ROOT}/${issueDate}/front-cover.jpg`,
                backCoverImage: isPagesOnly1988
                  ? `${CFRN_STORAGE_ROOT}/${issueDate}/${String(pageCount).padStart(3, "0")}.jpg`
                  : `${CFRN_STORAGE_ROOT}/${issueDate}/back-cover.jpg`,
                thumbnail: isPagesOnly1988
                  ? `${CFRN_STORAGE_ROOT}/${issueDate}/001.jpg`
                  : `${CFRN_STORAGE_ROOT}/${issueDate}/thumbnail.jpg`,
                pages: cfrn1976Pages(issueDate, 1, pageCount),
                featured: false,
              }
            })
          }'''
          s, n = re.subn(r'function getCfrn1980sStorageIssues\(\): NewspaperIssue\[\] \{.*?\n\}', func, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace getCfrn1980sStorageIssues')

          s = s.replace('museum-newspaper-archive-v2', 'museum-newspaper-archive-v3')
          p.write_text(s, encoding='utf-8')

          for name in [
              'lib/newspapers.ts',
              'app/media/newspapers/page.tsx',
              'app/api/newspaper-search/route.ts',
              'app/media/newspapers/[publication]/[issue]/page.tsx',
          ]:
              q = Path(name)
              text = q.read_text(encoding='utf-8')
              text = text.replace('.from("newspaper_ocr_pages")', '.from("newspaper_ocr_search_pages")')
              q.write_text(text, encoding='utf-8')
          PY

      - name: Verify 1988 publication bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path('lib/newspapers.ts').read_text(encoding='utf-8')
          assert '"1988-03-23": 24' in s
          assert '"1988-10-19": 16' in s
          assert 'museum-newspaper-archive-v3' in s
          assert 'isPagesOnly1988' in s
          for name in [
              'lib/newspapers.ts',
              'app/media/newspapers/page.tsx',
              'app/api/newspaper-search/route.ts',
              'app/media/newspapers/[publication]/[issue]/page.tsx',
          ]:
              text = Path(name).read_text(encoding='utf-8')
              assert '.from("newspaper_ocr_pages")' not in text
          print('1988 archive bridge and OCR search view references verified')
          PY

      - name: Commit 1988 publication bridge
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo '1988 publication bridge already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/newspapers.ts app/media/newspapers/page.tsx app/api/newspaper-search/route.ts 'app/media/newspapers/[publication]/[issue]/page.tsx'
          git commit -m 'Publish complete CFRN 1988 archive and OCR view'
          git push origin HEAD:main
