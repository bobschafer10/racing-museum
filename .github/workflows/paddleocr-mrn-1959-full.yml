name: PaddleOCR MRN 1959 Remaining Issues

on:
  push:
    branches:
      - paddleocr-mrn-pilot
    paths:
      - '.github/workflows/paddleocr-mrn-1959-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - issue: '1959-06-10'
            pages: '8'
          - issue: '1959-06-17'
            pages: '8'
          - issue: '1959-06-24'
            pages: '8'
          - issue: '1959-07-01'
            pages: '8'
          - issue: '1959-07-08'
            pages: '8'
          - issue: '1959-07-15'
            pages: '10'
          - issue: '1959-07-22'
            pages: '8'
          - issue: '1959-07-29'
            pages: '8'
          - issue: '1959-08-05'
            pages: '8'
          - issue: '1959-08-12'
            pages: '10'
          - issue: '1959-08-19'
            pages: '8'
          - issue: '1959-08-26'
            pages: '10'
          - issue: '1959-09-02'
            pages: '8'
          - issue: '1959-09-09'
            pages: '10'
          - issue: '1959-09-16'
            pages: '8'

    steps:
      - name: Check out OCR runner only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            museum-newspaper-manager/paddleocr-mrn-runner.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PaddleOCR CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.5.0 pillow

      - name: OCR ${{ matrix.issue }}
        shell: bash
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
          MRN_ISSUE_DATE: ${{ matrix.issue }}
          MRN_PAGE_COUNT: ${{ matrix.pages }}
          MRN_OUTPUT_ROOT: audit/paddleocr-mrn-1959/${{ matrix.issue }}
        run: |
          set -euo pipefail
          python museum-newspaper-manager/paddleocr-mrn-runner.py

      - name: Upload ${{ matrix.issue }} OCR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-1959-${{ matrix.issue }}
          path: audit/paddleocr-mrn-1959/${{ matrix.issue }}
          if-no-files-found: warn
          retention-days: 3

  aggregate:
    needs: ocr
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download issue artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mrn-1959-*
          path: collected
          merge-multiple: false

      - name: Build 1959 candidate index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aggregate
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('collected')
          summaries = []
          candidates = []
          for path in root.rglob('summary.json'):
              try:
                  summaries.append(json.loads(path.read_text(encoding='utf-8')))
              except Exception as e:
                  print('SUMMARY ERROR', path, e)
          for path in root.rglob('candidates.json'):
              try:
                  rows = json.loads(path.read_text(encoding='utf-8'))
                  if isinstance(rows, list):
                      candidates.extend(rows)
              except Exception as e:
                  print('CANDIDATE ERROR', path, e)

          summaries.sort(key=lambda x: x.get('issue_date',''))
          candidates.sort(key=lambda x: (x.get('issue_date',''), x.get('page',''), x.get('column',0), x.get('anchor_y',0)))

          index = {
              'year': 1959,
              'publication': 'midwest-racing-news',
              'scope': 'remaining issues after validated 1959-06-03 pilot',
              'issues_expected': 15,
              'issues_completed': len(summaries),
              'pages_completed': sum(int(s.get('page_count',0)) for s in summaries),
              'characters_recovered': sum(int(s.get('total_characters',0)) for s in summaries),
              'candidate_count': len(candidates),
              'issues': summaries,
          }
          Path('aggregate/1959-summary.json').write_text(json.dumps(index, indent=2), encoding='utf-8')
          Path('aggregate/1959-candidates.json').write_text(json.dumps(candidates, indent=2), encoding='utf-8')

          lines = [
              'MIDWEST RACING NEWS — 1959 OCR BATCH',
              f"Issues completed: {index['issues_completed']}/15",
              f"Pages completed: {index['pages_completed']}",
              f"Characters recovered: {index['characters_recovered']}",
              f"Standings candidates: {index['candidate_count']}",
              '',
          ]
          for c in candidates:
              lines.append(
                  f"{c.get('issue_date')} | {c.get('page')} | col {c.get('column')} | "
                  f"{c.get('classification_hint')} | {c.get('anchor')}"
              )
          Path('aggregate/1959-candidate-index.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('\n'.join(lines[:5]))
          PY

      - name: Upload combined 1959 index
        uses: actions/upload-artifact@v4
        with:
          name: mrn-1959-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 7
